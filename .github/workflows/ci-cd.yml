name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
    tags: [ '*.*.*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      run_full_e2e:
        description: 'Run full Playwright browser suite (release-equivalent)'
        required: false
        type: boolean
        default: false
  release:
    types: [ published ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    concurrency:
      group: build-${{ github.ref }}-${{ github.event_name }}
      cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

    steps:
    - uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: |
          frontend/package-lock.json
          backend/package-lock.json

    - name: Validate deploy safety flags
      run: node scripts/ci/check-deploy-safety.mjs

    - name: Validate SQL migration safety
      run: npm run ci:check:migration-safety

    - name: Install frontend dependencies
      run: cd frontend && npm ci

    - name: Lint frontend
      run: cd frontend && npm run lint

    - name: Build frontend
      run: cd frontend && npm run build

    - name: Validate compliance static pages and SMS consent artifact flow
      run: npm run ci:check:compliance-pages

    - name: Test frontend regression flows
      run: cd frontend && npm run test:flows

    - name: Test frontend auth hook regressions
      run: cd frontend && npx vitest run src/hooks/__tests__/useAuth.test.tsx

    - name: Install backend dependencies
      run: cd backend && npm ci

    - name: Typecheck backend
      run: cd backend && npm run typecheck

    - name: Validate backend test suites are non-empty
      run: node scripts/ci/check-empty-tests.mjs backend/src/__tests__

    - name: Build backend
      run: cd backend && npm run build

    - name: Test backend
      run: cd backend && npm run test:ci

  e2e_auth_preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build
    permissions:
      contents: read
    if: ${{ ((github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))) || github.event_name == 'release' || github.event_name == 'workflow_dispatch') && vars.E2E_API_BASE_URL != '' && vars.E2E_APP_URL != '' }}

    steps:
    - uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '24'

    - name: Validate auth preflight env
      env:
        E2E_REQUIRE_ROPC: '1'
        E2E_VALIDATE_VARIANT_A: ${{ github.event_name == 'release' || startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_full_e2e == 'true') }}
        E2E_APP_URL: ${{ vars.E2E_APP_URL }}
        E2E_API_BASE_URL: ${{ vars.E2E_API_BASE_URL }}
        AZURE_B2C_ROPC_POLICY: ${{ vars.AZURE_B2C_ROPC_POLICY }}
        AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
        AZURE_EXTERNAL_TENANT_NAME: ${{ vars.AZURE_EXTERNAL_TENANT_NAME }}
        AZURE_EXTERNAL_TENANT_ID: ${{ vars.AZURE_EXTERNAL_TENANT_ID }}
        AZURE_AUTHORITY_HOST: ${{ vars.AZURE_AUTHORITY_HOST }}
        VITE_API_SCOPE: ${{ vars.VITE_API_SCOPE }}
        E2E_AUTH_M2M_TENANT_ID: ${{ vars.AZURE_EXTERNAL_TENANT_ID }}
        E2E_AUTH_M2M_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
        E2E_AUTH_M2M_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        E2E_AUTH_M2M_SCOPE: ${{ vars.VITE_API_SCOPE }}
        PW_ADMIN_USER: ${{ secrets.PW_ADMIN_USER }}
        PW_ADMIN_PASS: ${{ secrets.PW_ADMIN_PASS }}
        PW_EVENT_CREATOR_USER: ${{ secrets.PW_EVENT_CREATOR_USER }}
        PW_EVENT_CREATOR_PASS: ${{ secrets.PW_EVENT_CREATOR_PASS }}
        PW_MEMBER_USER: ${{ secrets.PW_MEMBER_USER }}
        PW_MEMBER_PASS: ${{ secrets.PW_MEMBER_PASS }}
      run: node scripts/ci/check-e2e-auth-preflight.mjs --mode=env

  e2e_api_role_matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - build
      - e2e_refresh_auth_state
    permissions:
      contents: read
    if: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch') && vars.E2E_API_BASE_URL != '' && vars.E2E_APP_URL != '' }}

    steps:
    - uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: package-lock.json

    - name: Install Playwright dependencies
      run: npm ci

    - name: Read Playwright version
      id: pw_version
      run: |
        PW_VERSION="$(node -p "require('./node_modules/@playwright/test/package.json').version")"
        echo "version=$PW_VERSION" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browsers
      id: pw_cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ms-playwright-${{ runner.os }}-${{ steps.pw_version.outputs.version }}-chromium

    - name: Install Playwright Chromium for token refresh helper
      timeout-minutes: 15
      run: |
        if [ "${{ steps.pw_cache.outputs.cache-hit }}" = "true" ]; then
          npx playwright install-deps chromium
        else
          npx playwright install --with-deps chromium
        fi

    - name: Download Playwright auth state
      uses: actions/download-artifact@v5
      with:
        name: playwright-auth-state-${{ github.run_id }}
        path: tests/e2e/.auth

    - name: Run Playwright API role matrix and event lead lifecycle
      env:
        E2E_API_BASE_URL: ${{ vars.E2E_API_BASE_URL }}
        PW_WORKERS: '3'
        PW_RETRIES: '0'
        PW_MAX_FAILURES: '3'
      run: |
        set -euo pipefail
        source tests/e2e/.auth/tokens.env
        npm run test:e2e:role-matrix -- --workers=3 --max-failures=3

    - name: Upload Playwright artifacts on failure
      if: ${{ failure() || cancelled() }}
      uses: actions/upload-artifact@v5
      with:
        name: playwright-api-role-matrix-artifacts-${{ github.run_id }}
        if-no-files-found: ignore
        retention-days: 14
        path: |
          playwright-report/**
          test-results/**

  e2e_browser_auth_email_hint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - build
      - e2e_refresh_auth_state
    permissions:
      contents: read
    if: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_full_e2e == 'true')) && vars.E2E_API_BASE_URL != '' && vars.E2E_APP_URL != '' }}

    steps:
    - uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: package-lock.json

    - name: Install Playwright dependencies
      run: npm ci

    - name: Read Playwright version
      id: pw_version
      run: |
        PW_VERSION="$(node -p "require('./node_modules/@playwright/test/package.json').version")"
        echo "version=$PW_VERSION" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browsers
      id: pw_cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ms-playwright-${{ runner.os }}-${{ steps.pw_version.outputs.version }}-chromium

    - name: Install Playwright Chromium
      timeout-minutes: 15
      run: |
        if [ "${{ steps.pw_cache.outputs.cache-hit }}" = "true" ]; then
          npx playwright install-deps chromium
        else
          npx playwright install --with-deps chromium
        fi

    - name: Download Playwright auth state
      uses: actions/download-artifact@v5
      with:
        name: playwright-auth-state-${{ github.run_id }}
        path: tests/e2e/.auth

    - name: Probe member auth state id_token email claim
      id: member_email_hint_probe
      continue-on-error: true
      run: node scripts/ci/check-e2e-auth-preflight.mjs --mode=auth-state --state-path=tests/e2e/.auth/member.json

    - name: Warn when member id_token email claim is missing
      if: ${{ steps.member_email_hint_probe.outcome != 'success' }}
      run: |
        echo "::warning::Member auth state is missing id_token email claim."
        echo "::warning::Proceeding to browser-auth-email-hint regression, which will attempt credential login fallback."

    - name: Run browser auth email-hint regression
      env:
        E2E_APP_URL: ${{ vars.E2E_APP_URL }}
        E2E_API_BASE_URL: ${{ vars.E2E_API_BASE_URL }}
        PW_MEMBER_USER: ${{ secrets.PW_MEMBER_USER }}
        PW_MEMBER_PASS: ${{ secrets.PW_MEMBER_PASS }}
      run: npx playwright test tests/e2e/browser-auth-email-hint.spec.ts --workers=1 --max-failures=1

    - name: Upload Playwright artifacts on failure
      if: ${{ failure() || cancelled() }}
      uses: actions/upload-artifact@v5
      with:
        name: playwright-browser-auth-email-hint-artifacts-${{ github.run_id }}
        if-no-files-found: ignore
        retention-days: 14
        path: |
          playwright-report/**
          test-results/**

  e2e_browser_launch_smoke_local:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    permissions:
      contents: read
    if: ${{ github.event_name != 'release' }}

    steps:
    - uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: |
          package-lock.json
          frontend/package-lock.json
          backend/package-lock.json

    - name: Install root Playwright dependencies
      run: npm ci

    - name: Install frontend dependencies
      run: cd frontend && npm ci

    - name: Install backend dependencies
      run: cd backend && npm ci

    - name: Read Playwright version
      id: pw_version
      run: |
        PW_VERSION="$(node -p "require('./node_modules/@playwright/test/package.json').version")"
        echo "version=$PW_VERSION" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browsers
      id: pw_cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ms-playwright-${{ runner.os }}-${{ steps.pw_version.outputs.version }}-chromium

    - name: Install Playwright Chromium
      timeout-minutes: 15
      run: |
        if [ "${{ steps.pw_cache.outputs.cache-hit }}" = "true" ]; then
          npx playwright install-deps chromium
        else
          npx playwright install --with-deps chromium
        fi

    - name: Run local browser launch smoke against current commit
      env:
        CI: '1'
        E2E_LOCAL_AUTH_ENABLED: '1'
        E2E_API_BASE_URL: http://127.0.0.1:3001
        E2E_APP_URL: http://127.0.0.1:4173
        VITE_E2E_LOCAL_AUTH: '1'
        VITE_API_BASE_URL: http://127.0.0.1:3001/api/v1
      run: |
        set -euo pipefail

        cleanup() {
          if [ -n "${BACKEND_PID:-}" ]; then kill "$BACKEND_PID" >/dev/null 2>&1 || true; fi
          if [ -n "${FRONTEND_PID:-}" ]; then kill "$FRONTEND_PID" >/dev/null 2>&1 || true; fi
        }
        trap cleanup EXIT

        (cd backend && npm run dev) > /tmp/phw-backend.log 2>&1 &
        BACKEND_PID=$!

        (cd frontend && npm run dev -- --host 127.0.0.1 --port 4173) > /tmp/phw-frontend.log 2>&1 &
        FRONTEND_PID=$!

        for attempt in $(seq 1 30); do
          if curl -fsS --max-time 5 "${E2E_API_BASE_URL}/api/v1/health" >/dev/null 2>&1; then
            break
          fi
          if [ "$attempt" -eq 30 ]; then
            echo 'Backend did not become ready in time.'
            cat /tmp/phw-backend.log
            exit 1
          fi
          sleep 2
        done

        for attempt in $(seq 1 30); do
          if curl -fsS --max-time 5 "${E2E_APP_URL}" >/dev/null 2>&1; then
            break
          fi
          if [ "$attempt" -eq 30 ]; then
            echo 'Frontend did not become ready in time.'
            cat /tmp/phw-frontend.log
            exit 1
          fi
          sleep 2
        done

        npm run test:e2e:launch-smoke -- --workers=1 --max-failures=1

    - name: Upload Playwright artifacts on failure
      if: ${{ failure() || cancelled() }}
      uses: actions/upload-artifact@v5
      with:
        name: playwright-browser-launch-smoke-local-artifacts-${{ github.run_id }}
        if-no-files-found: ignore
        retention-days: 14
        path: |
          playwright-report/**
          test-results/**

  e2e_refresh_auth_state:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - build
      - e2e_auth_preflight
    permissions:
      contents: read
      actions: write
    if: ${{ ((github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))) || github.event_name == 'release' || github.event_name == 'workflow_dispatch') && vars.E2E_API_BASE_URL != '' && vars.E2E_APP_URL != '' }}

    steps:
    - uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: package-lock.json

    - name: Install Playwright dependencies
      run: npm ci

    - name: Read Playwright version
      id: pw_version
      run: |
        PW_VERSION="$(node -p "require('./node_modules/@playwright/test/package.json').version")"
        echo "version=$PW_VERSION" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browsers
      id: pw_cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ms-playwright-${{ runner.os }}-${{ steps.pw_version.outputs.version }}-chromium

    - name: Install Playwright Chromium
      timeout-minutes: 15
      run: |
        if [ "${{ steps.pw_cache.outputs.cache-hit }}" = "true" ]; then
          npx playwright install-deps chromium
        else
          npx playwright install --with-deps chromium
        fi

    - name: Refresh Playwright tokens and storage state (primary)
      id: refresh_auth_state_primary
      continue-on-error: true
      env:
        E2E_API_BASE_URL: ${{ vars.E2E_API_BASE_URL }}
        E2E_APP_URL: ${{ vars.E2E_APP_URL }}
        PW_TOKEN_ENV_FILE: tests/e2e/.auth/tokens.env
        PW_REFRESH_ROLE_TIMEOUT_MS: '180000'
        PW_REFRESH_MAX_ATTEMPTS: '2'
        AZURE_B2C_ROPC_POLICY: ${{ vars.AZURE_B2C_ROPC_POLICY }}
        AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
        AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        VITE_API_SCOPE: ${{ vars.VITE_API_SCOPE }}
        AZURE_EXTERNAL_TENANT_NAME: ${{ vars.AZURE_EXTERNAL_TENANT_NAME }}
        AZURE_EXTERNAL_TENANT_ID: ${{ vars.AZURE_EXTERNAL_TENANT_ID }}
        AZURE_AUTHORITY_HOST: ${{ vars.AZURE_AUTHORITY_HOST }}
        PW_ADMIN_USER: ${{ secrets.PW_ADMIN_USER }}
        PW_ADMIN_PASS: ${{ secrets.PW_ADMIN_PASS }}
        PW_EVENT_CREATOR_USER: ${{ secrets.PW_EVENT_CREATOR_USER }}
        PW_EVENT_CREATOR_PASS: ${{ secrets.PW_EVENT_CREATOR_PASS }}
        PW_MEMBER_USER: ${{ secrets.PW_MEMBER_USER }}
        PW_MEMBER_PASS: ${{ secrets.PW_MEMBER_PASS }}
      run: npm run e2e:refresh-tokens -- --soft-skip

    - name: Refresh Playwright tokens and storage state (retry, extended timeout)
      if: ${{ steps.refresh_auth_state_primary.outcome != 'success' }}
      continue-on-error: true
      env:
        E2E_API_BASE_URL: ${{ vars.E2E_API_BASE_URL }}
        E2E_APP_URL: ${{ vars.E2E_APP_URL }}
        PW_TOKEN_ENV_FILE: tests/e2e/.auth/tokens.env
        PW_REFRESH_ROLE_TIMEOUT_MS: '300000'
        PW_REFRESH_MAX_ATTEMPTS: '4'
        AZURE_B2C_ROPC_POLICY: ${{ vars.AZURE_B2C_ROPC_POLICY }}
        AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
        AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        VITE_API_SCOPE: ${{ vars.VITE_API_SCOPE }}
        AZURE_EXTERNAL_TENANT_NAME: ${{ vars.AZURE_EXTERNAL_TENANT_NAME }}
        AZURE_EXTERNAL_TENANT_ID: ${{ vars.AZURE_EXTERNAL_TENANT_ID }}
        AZURE_AUTHORITY_HOST: ${{ vars.AZURE_AUTHORITY_HOST }}
        PW_ADMIN_USER: ${{ secrets.PW_ADMIN_USER }}
        PW_ADMIN_PASS: ${{ secrets.PW_ADMIN_PASS }}
        PW_EVENT_CREATOR_USER: ${{ secrets.PW_EVENT_CREATOR_USER }}
        PW_EVENT_CREATOR_PASS: ${{ secrets.PW_EVENT_CREATOR_PASS }}
        PW_MEMBER_USER: ${{ secrets.PW_MEMBER_USER }}
        PW_MEMBER_PASS: ${{ secrets.PW_MEMBER_PASS }}
      run: npm run e2e:refresh-tokens -- --soft-skip

    - name: Ensure auth state placeholders exist
      run: |
        mkdir -p tests/e2e/.auth
        for f in admin.json event-creator.json member.json; do
          if [ ! -f "tests/e2e/.auth/$f" ]; then
            echo '{"cookies":[],"origins":[]}' > "tests/e2e/.auth/$f"
          fi
        done

    - name: Validate refreshed token exports exist
      run: |
        set -euo pipefail
        if [ ! -s tests/e2e/.auth/tokens.env ]; then
          echo 'Missing tests/e2e/.auth/tokens.env from refresh step.'
          exit 1
        fi

        source tests/e2e/.auth/tokens.env

        for var in PW_ADMIN_TOKEN PW_EVENT_CREATOR_TOKEN PW_MEMBER_TOKEN; do
          val="${!var:-}"
          if [ -z "$val" ]; then
            echo "Missing refreshed token export: $var"
            exit 1
          fi
        done

    - name: Probe member auth state id_token email claim
      id: member_email_hint_probe
      continue-on-error: true
      run: node scripts/ci/check-e2e-auth-preflight.mjs --mode=auth-state --state-path=tests/e2e/.auth/member.json

    - name: Warn when member id_token email claim is missing
      if: ${{ steps.member_email_hint_probe.outcome != 'success' }}
      run: |
        echo "::warning::Member auth state is missing id_token email claim."
        echo "::warning::Auth-refresh remains green so non-email-hint suites can execute; e2e_browser_auth_email_hint will enforce this as a hard requirement."

    - name: Upload debug screenshots on auth failure
      if: ${{ failure() }}
      uses: actions/upload-artifact@v5
      with:
        name: playwright-auth-debug-${{ github.run_id }}
        include-hidden-files: true
        if-no-files-found: ignore
        retention-days: 7
        path: tests/e2e/.auth/*-failure.png

    - name: Upload Playwright auth state
      uses: actions/upload-artifact@v5
      with:
        name: playwright-auth-state-${{ github.run_id }}
        include-hidden-files: true
        if-no-files-found: warn
        retention-days: 2
        path: tests/e2e/.auth/**

  e2e_api_notification_lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - build
      - e2e_refresh_auth_state
    permissions:
      contents: read
    if: ${{ ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_full_e2e == 'true')) && vars.E2E_API_BASE_URL != '' && vars.E2E_APP_URL != '' }}

    steps:
    - uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: package-lock.json

    - name: Install Playwright dependencies
      run: npm ci

    - name: Download Playwright auth state
      uses: actions/download-artifact@v5
      with:
        name: playwright-auth-state-${{ github.run_id }}
        path: tests/e2e/.auth

    - name: Run API notification lifecycle e2e
      env:
        E2E_API_BASE_URL: ${{ vars.E2E_API_BASE_URL }}
        PW_WORKERS: '3'
        PW_RETRIES: '0'
        PW_MAX_FAILURES: '2'
      run: |
        set -euo pipefail
        source tests/e2e/.auth/tokens.env
        npx playwright test tests/e2e/api-notification-lifecycle.spec.ts --workers=3 --max-failures=2

    - name: Upload Playwright artifacts on failure
      if: ${{ failure() || cancelled() }}
      uses: actions/upload-artifact@v5
      with:
        name: playwright-api-notification-lifecycle-artifacts-${{ github.run_id }}
        if-no-files-found: ignore
        retention-days: 14
        path: |
          playwright-report/**
          test-results/**

  e2e_browser_auth_flows:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: e2e_refresh_auth_state
    permissions:
      contents: read
      actions: read
    # Known-flaky against Google-federated test accounts: Google blocks Playwright
    # automation with the "Sign in rejected" screen.  Job is informational until
    # test users are migrated to CIAM-local credentials (tracked separately).
    continue-on-error: true
    if: ${{ ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_full_e2e == 'true')) && vars.E2E_API_BASE_URL != '' && vars.E2E_APP_URL != '' }}

    steps:
    - uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: package-lock.json

    - name: Install Playwright dependencies
      run: npm ci

    - name: Read Playwright version
      id: pw_version
      run: |
        PW_VERSION="$(node -p "require('./node_modules/@playwright/test/package.json').version")"
        echo "version=$PW_VERSION" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browsers
      id: pw_cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ms-playwright-${{ runner.os }}-${{ steps.pw_version.outputs.version }}-chromium

    - name: Install Playwright Chromium
      timeout-minutes: 15
      run: |
        if [ "${{ steps.pw_cache.outputs.cache-hit }}" = "true" ]; then
          npx playwright install-deps chromium
        else
          npx playwright install --with-deps chromium
        fi

    - name: Download Playwright auth state
      uses: actions/download-artifact@v5
      with:
        name: playwright-auth-state-${{ github.run_id }}
        path: tests/e2e/.auth

    - name: Run browser auth flow tests (fail-fast)
      env:
        E2E_API_BASE_URL: ${{ vars.E2E_API_BASE_URL }}
        E2E_APP_URL: ${{ vars.E2E_APP_URL }}
        E2E_AUTH_VARIANT_A_ENABLED: '1'
        E2E_AUTH_M2M_TENANT_ID: ${{ vars.AZURE_EXTERNAL_TENANT_ID }}
        E2E_AUTH_M2M_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
        E2E_AUTH_M2M_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        E2E_AUTH_M2M_SCOPE: ${{ vars.VITE_API_SCOPE }}
        PW_ADMIN_USER: ${{ secrets.PW_ADMIN_USER }}
        PW_ADMIN_PASS: ${{ secrets.PW_ADMIN_PASS }}
        PW_EVENT_CREATOR_USER: ${{ secrets.PW_EVENT_CREATOR_USER }}
        PW_EVENT_CREATOR_PASS: ${{ secrets.PW_EVENT_CREATOR_PASS }}
        PW_MEMBER_USER: ${{ secrets.PW_MEMBER_USER }}
        PW_MEMBER_PASS: ${{ secrets.PW_MEMBER_PASS }}
        PW_WORKERS: '3'
        PW_RETRIES: '0'
        PW_MAX_FAILURES: '2'
      run: npx playwright test tests/e2e/browser-auth-flows.spec.ts --workers=1 --retries=0 --max-failures=2

    - name: Upload Playwright artifacts on failure
      if: ${{ failure() || cancelled() }}
      uses: actions/upload-artifact@v5
      with:
        name: playwright-browser-auth-flows-artifacts-${{ github.run_id }}
        if-no-files-found: ignore
        retention-days: 14
        path: |
          playwright-report/**
          test-results/**
          tests/e2e/.auth/*.png

  e2e_browser_persona_matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: e2e_refresh_auth_state
    permissions:
      contents: read
      actions: read
    # Known-flaky against Google-federated test accounts (see e2e_browser_auth_flows).
    continue-on-error: true
    if: ${{ ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_full_e2e == 'true')) && vars.E2E_API_BASE_URL != '' && vars.E2E_APP_URL != '' }}

    steps:
    - uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: package-lock.json

    - name: Install Playwright dependencies
      run: npm ci

    - name: Read Playwright version
      id: pw_version
      run: |
        PW_VERSION="$(node -p "require('./node_modules/@playwright/test/package.json').version")"
        echo "version=$PW_VERSION" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browsers
      id: pw_cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ms-playwright-${{ runner.os }}-${{ steps.pw_version.outputs.version }}-chromium

    - name: Install Playwright Chromium
      timeout-minutes: 15
      run: |
        if [ "${{ steps.pw_cache.outputs.cache-hit }}" = "true" ]; then
          npx playwright install-deps chromium
        else
          npx playwright install --with-deps chromium
        fi

    - name: Download Playwright auth state
      uses: actions/download-artifact@v5
      with:
        name: playwright-auth-state-${{ github.run_id }}
        path: tests/e2e/.auth

    - name: Run browser persona matrix
      env:
        E2E_APP_URL: ${{ vars.E2E_APP_URL }}
        E2E_API_BASE_URL: ${{ vars.E2E_API_BASE_URL }}
        E2E_AUTH_VARIANT_A_ENABLED: '1'
        E2E_AUTH_M2M_TENANT_ID: ${{ vars.AZURE_EXTERNAL_TENANT_ID }}
        E2E_AUTH_M2M_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
        E2E_AUTH_M2M_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        E2E_AUTH_M2M_SCOPE: ${{ vars.VITE_API_SCOPE }}
        PW_ADMIN_USER: ${{ secrets.PW_ADMIN_USER }}
        PW_ADMIN_PASS: ${{ secrets.PW_ADMIN_PASS }}
        PW_EVENT_CREATOR_USER: ${{ secrets.PW_EVENT_CREATOR_USER }}
        PW_EVENT_CREATOR_PASS: ${{ secrets.PW_EVENT_CREATOR_PASS }}
        PW_MEMBER_USER: ${{ secrets.PW_MEMBER_USER }}
        PW_MEMBER_PASS: ${{ secrets.PW_MEMBER_PASS }}
        PW_WORKERS: '3'
        PW_RETRIES: '0'
        PW_MAX_FAILURES: '2'
      run: npx playwright test tests/e2e/browser-persona-flow-matrix.spec.ts --workers=1 --retries=0 --max-failures=2

    - name: Upload Playwright artifacts on failure
      if: ${{ failure() || cancelled() }}
      uses: actions/upload-artifact@v5
      with:
        name: playwright-browser-persona-artifacts-${{ github.run_id }}
        if-no-files-found: ignore
        retention-days: 14
        path: |
          playwright-report/**
          test-results/**
          tests/e2e/.auth/*.png

  e2e_browser_postdeploy_smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - e2e_refresh_auth_state
      - e2e_browser_auth_flows
      - e2e_browser_persona_matrix
    permissions:
      contents: read
      actions: read
    if: ${{ ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_full_e2e == 'true')) && vars.E2E_API_BASE_URL != '' && vars.E2E_APP_URL != '' }}

    steps:
    - uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: package-lock.json

    - name: Install Playwright dependencies
      run: npm ci

    - name: Read Playwright version
      id: pw_version
      run: |
        PW_VERSION="$(node -p "require('./node_modules/@playwright/test/package.json').version")"
        echo "version=$PW_VERSION" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browsers
      id: pw_cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ms-playwright-${{ runner.os }}-${{ steps.pw_version.outputs.version }}-chromium

    - name: Install Playwright Chromium
      timeout-minutes: 25
      run: |
        if [ "${{ steps.pw_cache.outputs.cache-hit }}" = "true" ]; then
          npx playwright install-deps chromium
        else
          npx playwright install --with-deps chromium
        fi

    - name: Download Playwright auth state
      uses: actions/download-artifact@v5
      with:
        name: playwright-auth-state-${{ github.run_id }}
        path: tests/e2e/.auth

    - name: Run postdeploy browser smoke
      env:
        E2E_APP_URL: ${{ vars.E2E_APP_URL }}
        E2E_API_BASE_URL: ${{ vars.E2E_API_BASE_URL }}
        E2E_AUTH_VARIANT_A_ENABLED: '1'
        E2E_AUTH_M2M_TENANT_ID: ${{ vars.AZURE_EXTERNAL_TENANT_ID }}
        E2E_AUTH_M2M_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
        E2E_AUTH_M2M_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        E2E_AUTH_M2M_SCOPE: ${{ vars.VITE_API_SCOPE }}
        PW_MEMBER_USER: ${{ secrets.PW_MEMBER_USER }}
        PW_MEMBER_PASS: ${{ secrets.PW_MEMBER_PASS }}
        PW_WORKERS: '3'
        PW_RETRIES: '0'
        PW_MAX_FAILURES: '2'
      run: npx playwright test tests/e2e/browser-postdeploy-smoke.spec.ts --workers=3 --max-failures=2

    - name: Upload Playwright artifacts on failure
      if: ${{ failure() || cancelled() }}
      uses: actions/upload-artifact@v5
      with:
        name: playwright-browser-postdeploy-smoke-artifacts-${{ github.run_id }}
        if-no-files-found: ignore
        retention-days: 14
        path: |
          playwright-report/**
          test-results/**
          tests/e2e/.auth/*.png

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs:
    - build
    - e2e_browser_launch_smoke_local
    - e2e_api_role_matrix
    - e2e_browser_auth_email_hint
    permissions:
      contents: read
      id-token: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AZURE_WEBAPP_NAME != ''
    concurrency:
      group: azure-prod-deploy-${{ github.ref_name }}
      cancel-in-progress: false

    steps:
    - uses: actions/checkout@v5

    - name: Check for stale main deploy
      id: stale_guard
      env:
        GITHUB_SHA: ${{ github.sha }}
      run: |
        LATEST_MAIN_SHA="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
        if [ -z "$LATEST_MAIN_SHA" ]; then
          echo "Unable to resolve origin/main head; proceeding with deploy."
          echo "stale_run=0" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        echo "Current run SHA: $GITHUB_SHA"
        echo "Latest main SHA: $LATEST_MAIN_SHA"
        if [ "$LATEST_MAIN_SHA" != "$GITHUB_SHA" ]; then
          echo "Newer main commit detected; skipping stale deploy run."
          echo "stale_run=1" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        echo "stale_run=0" >> "$GITHUB_OUTPUT"

    - name: Skip stale deploy run
      if: ${{ steps.stale_guard.outputs.stale_run == '1' }}
      run: echo "Skipping deploy for stale run ${{ github.run_id }}; a newer main commit is queued or running."

    - name: Setup Node.js
      if: ${{ steps.stale_guard.outputs.stale_run != '1' }}
      uses: actions/setup-node@v5
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json

    - name: Install backend dependencies
      if: ${{ steps.stale_guard.outputs.stale_run != '1' }}
      run: cd backend && npm ci

    - name: Deploy backend database schema
      if: ${{ steps.stale_guard.outputs.stale_run != '1' }}
      env:
        MIGRATION_DB_HOST: ${{ vars.MIGRATION_DB_HOST }}
        MIGRATION_DB_PORT: ${{ vars.MIGRATION_DB_PORT }}
        MIGRATION_DB_NAME: ${{ vars.MIGRATION_DB_NAME }}
        MIGRATION_DB_USER: ${{ vars.MIGRATION_DB_USER }}
        MIGRATION_DB_PASSWORD: ${{ secrets.MIGRATION_DB_PASSWORD }}
        DB_HOST: ${{ vars.DB_HOST }}
        DB_PORT: ${{ vars.DB_PORT }}
        DB_NAME: ${{ vars.DB_NAME }}
        DB_USER: ${{ vars.DB_USER }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      run: |
        RESOLVED_DB_HOST="${MIGRATION_DB_HOST:-${DB_HOST:-}}"
        RESOLVED_DB_PORT="${MIGRATION_DB_PORT:-${DB_PORT:-1433}}"
        RESOLVED_DB_NAME="${MIGRATION_DB_NAME:-${DB_NAME:-}}"
        RESOLVED_DB_USER="${MIGRATION_DB_USER:-${DB_USER:-}}"
        RESOLVED_DB_PASSWORD="${MIGRATION_DB_PASSWORD:-${DB_PASSWORD:-}}"

        if [ -z "$RESOLVED_DB_HOST" ] || [ -z "$RESOLVED_DB_NAME" ] || [ -z "$RESOLVED_DB_USER" ] || [ -z "$RESOLVED_DB_PASSWORD" ]; then
          echo "::error::Database schema deployment requires MIGRATION_DB_HOST/MIGRATION_DB_NAME/MIGRATION_DB_USER and secret MIGRATION_DB_PASSWORD. DB_* fallbacks are supported but not configured."
          exit 1
        fi

        export MIGRATION_DB_HOST="$RESOLVED_DB_HOST"
        export MIGRATION_DB_PORT="$RESOLVED_DB_PORT"
        export MIGRATION_DB_NAME="$RESOLVED_DB_NAME"
        export MIGRATION_DB_USER="$RESOLVED_DB_USER"
        export MIGRATION_DB_PASSWORD="$RESOLVED_DB_PASSWORD"

        npm --prefix backend run deploy-schema

    - name: Build backend
      if: ${{ steps.stale_guard.outputs.stale_run != '1' }}
      run: cd backend && npm run build

    - name: Prepare deployment package (mode-aware)
      if: ${{ steps.stale_guard.outputs.stale_run != '1' }}
      env:
        BACKEND_DEPLOY_INCLUDE_NODE_MODULES: ${{ vars.BACKEND_DEPLOY_INCLUDE_NODE_MODULES }}
      run: |
        rm -rf deploy-package
        rm -f release.zip
        mkdir -p deploy-package
        cp -R backend/dist deploy-package/dist
        cp backend/package.json deploy-package/package.json
        cp backend/package-lock.json deploy-package/package-lock.json
        cp backend/server.js deploy-package/server.js
        cp backend/web.config deploy-package/web.config

        if [ "${BACKEND_DEPLOY_INCLUDE_NODE_MODULES:-0}" = "1" ]; then
          echo "Using legacy backend packaging (includes node_modules)."
          (cd backend && npm prune --omit=dev)
          cp -R backend/node_modules deploy-package/node_modules
        else
          echo "Using slim backend packaging (package-manager restore during deploy)."
          printf '%s\n' '[config]' 'SCM_DO_BUILD_DURING_DEPLOYMENT=true' 'ENABLE_ORYX_BUILD=true' > deploy-package/.deployment
        fi

        cd deploy-package
        zip -r ../release.zip .

    - name: Determine backend deploy mode
      id: backend_deploy_mode
      if: ${{ steps.stale_guard.outputs.stale_run != '1' }}
      env:
        BACKEND_BLUE_GREEN_ENABLED: ${{ vars.BACKEND_BLUE_GREEN_ENABLED }}
        AZURE_BACKEND_RESOURCE_GROUP: ${{ vars.AZURE_BACKEND_RESOURCE_GROUP }}
        AZURE_BACKEND_SLOT_NAME: ${{ vars.AZURE_BACKEND_SLOT_NAME }}
        AZURE_BACKEND_DEPLOY_CREDENTIALS: ${{ secrets.AZURE_BACKEND_DEPLOY_CREDENTIALS }}
      run: |
        MODE="${BACKEND_BLUE_GREEN_ENABLED:-0}"
        if [ "$MODE" = "1" ]; then
          if [ -z "${AZURE_BACKEND_RESOURCE_GROUP}" ] || [ -z "${AZURE_BACKEND_SLOT_NAME}" ] || [ -z "${AZURE_BACKEND_DEPLOY_CREDENTIALS}" ]; then
            echo "::error::BACKEND_BLUE_GREEN_ENABLED=1 requires vars.AZURE_BACKEND_RESOURCE_GROUP, vars.AZURE_BACKEND_SLOT_NAME, and secrets.AZURE_BACKEND_DEPLOY_CREDENTIALS"
            exit 1
          fi
          echo "use_blue_green=1" >> "$GITHUB_OUTPUT"
          echo "Backend deploy mode: blue-green"
        else
          echo "use_blue_green=0" >> "$GITHUB_OUTPUT"
          echo "Backend deploy mode: direct"
        fi

    - name: Azure CLI login (backend blue-green)
      if: ${{ steps.stale_guard.outputs.stale_run != '1' && steps.backend_deploy_mode.outputs.use_blue_green == '1' }}
      env:
        AZURE_BACKEND_DEPLOY_CREDENTIALS: ${{ secrets.AZURE_BACKEND_DEPLOY_CREDENTIALS }}
      run: |
        AZ_LINE=$(python -c "import json,os; creds=json.loads(os.environ['AZURE_BACKEND_DEPLOY_CREDENTIALS']); print('\\t'.join([creds.get('clientId',''), creds.get('clientSecret',''), creds.get('tenantId',''), creds.get('subscriptionId','')]))")

        IFS=$'\t' read -r AZ_CLIENT_ID AZ_CLIENT_SECRET AZ_TENANT_ID AZ_SUBSCRIPTION_ID <<< "$AZ_LINE"

        if [ -z "$AZ_CLIENT_ID" ] || [ -z "$AZ_CLIENT_SECRET" ] || [ -z "$AZ_TENANT_ID" ] || [ -z "$AZ_SUBSCRIPTION_ID" ]; then
          echo "AZURE_BACKEND_DEPLOY_CREDENTIALS is missing required fields"
          exit 1
        fi

        for attempt in $(seq 1 5); do
          set +e
          LOGIN_OUTPUT=$(timeout 120 az login --service-principal \
            --username "$AZ_CLIENT_ID" \
            --password "$AZ_CLIENT_SECRET" \
            --tenant "$AZ_TENANT_ID" \
            --output none 2>&1)
          LOGIN_EXIT=$?
          set -e

          echo "$LOGIN_OUTPUT"

          if [ "$LOGIN_EXIT" -eq 0 ]; then
            az account set --subscription "$AZ_SUBSCRIPTION_ID"
            echo "Azure backend login succeeded."
            exit 0
          fi

          if [ "$LOGIN_EXIT" -eq 124 ] || printf "%s" "$LOGIN_OUTPUT" | grep -Eqi "timed out|timeout|temporarily unavailable|connection|EOF|unreachable"; then
            echo "Azure backend login transient failure (attempt $attempt/5). Retrying in 15s..."
            sleep 15
            continue
          fi

          echo "Azure backend login failed with a non-retryable error."
          exit "$LOGIN_EXIT"
        done

        echo "Azure backend login failed after retries."
        exit 1

    - name: Ensure AUTHZ app settings are slot-sticky on prod and staging
      # Authoritative AUTHZ knobs MUST be present on both slots and pinned via
      # slotConfigNames (--slot-settings) so a slot swap does NOT leak the
      # source-of-truth flag.  Idempotent: re-applying does not change values.
      # If the secrets are not provided we leave existing values alone (blank
      # secret => skip, never wipe).
      if: ${{ steps.stale_guard.outputs.stale_run != '1' && steps.backend_deploy_mode.outputs.use_blue_green == '1' }}
      env:
        AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
        AZURE_BACKEND_RESOURCE_GROUP: ${{ vars.AZURE_BACKEND_RESOURCE_GROUP }}
        AZURE_BACKEND_SLOT_NAME: ${{ vars.AZURE_BACKEND_SLOT_NAME }}
        AUTH_ALLOW_TOKEN_ROLE_FALLBACK: ${{ vars.AUTH_ALLOW_TOKEN_ROLE_FALLBACK }}
        AUTH_BOOTSTRAP_ADMIN_EMAILS: ${{ secrets.AUTH_BOOTSTRAP_ADMIN_EMAILS }}
      run: |
        SETTINGS=()
        if [ -n "${AUTH_ALLOW_TOKEN_ROLE_FALLBACK}" ]; then
          SETTINGS+=("AUTH_ALLOW_TOKEN_ROLE_FALLBACK=${AUTH_ALLOW_TOKEN_ROLE_FALLBACK}")
        fi
        if [ -n "${AUTH_BOOTSTRAP_ADMIN_EMAILS}" ]; then
          SETTINGS+=("AUTH_BOOTSTRAP_ADMIN_EMAILS=${AUTH_BOOTSTRAP_ADMIN_EMAILS}")
        fi

        if [ "${#SETTINGS[@]}" -eq 0 ]; then
          echo "No AUTHZ vars/secrets provided; relying on existing slot-sticky values."
          exit 0
        fi

        echo "Applying ${#SETTINGS[@]} AUTHZ slot-sticky setting(s) to production slot."
        az webapp config appsettings set \
          --resource-group "$AZURE_BACKEND_RESOURCE_GROUP" \
          --name "$AZURE_WEBAPP_NAME" \
          --slot-settings "${SETTINGS[@]}" \
          --output none

        echo "Applying ${#SETTINGS[@]} AUTHZ slot-sticky setting(s) to staging slot."
        az webapp config appsettings set \
          --resource-group "$AZURE_BACKEND_RESOURCE_GROUP" \
          --name "$AZURE_WEBAPP_NAME" \
          --slot "$AZURE_BACKEND_SLOT_NAME" \
          --slot-settings "${SETTINGS[@]}" \
          --output none

        echo "AUTHZ slot-sticky settings applied."

    - name: Ensure deploy build settings are slot-sticky on prod and staging
      if: ${{ steps.stale_guard.outputs.stale_run != '1' && steps.backend_deploy_mode.outputs.use_blue_green == '1' }}
      env:
        AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
        AZURE_BACKEND_RESOURCE_GROUP: ${{ vars.AZURE_BACKEND_RESOURCE_GROUP }}
        AZURE_BACKEND_SLOT_NAME: ${{ vars.AZURE_BACKEND_SLOT_NAME }}
        BACKEND_DEPLOY_INCLUDE_NODE_MODULES: ${{ vars.BACKEND_DEPLOY_INCLUDE_NODE_MODULES }}
      run: |
        if [ "${BACKEND_DEPLOY_INCLUDE_NODE_MODULES:-0}" = "1" ]; then
          BUILD_SETTINGS=(
            "SCM_DO_BUILD_DURING_DEPLOYMENT=false"
            "ENABLE_ORYX_BUILD=false"
          )
          echo "Using legacy packaging; disabling remote build settings."
        else
          BUILD_SETTINGS=(
            "SCM_DO_BUILD_DURING_DEPLOYMENT=true"
            "ENABLE_ORYX_BUILD=true"
          )
          echo "Using slim packaging; enabling remote build settings."
        fi

        echo "Applying deploy build settings to production slot."
        az webapp config appsettings set \
          --resource-group "$AZURE_BACKEND_RESOURCE_GROUP" \
          --name "$AZURE_WEBAPP_NAME" \
          --slot-settings "${BUILD_SETTINGS[@]}" \
          --output none

        echo "Applying deploy build settings to staging slot."
        az webapp config appsettings set \
          --resource-group "$AZURE_BACKEND_RESOURCE_GROUP" \
          --name "$AZURE_WEBAPP_NAME" \
          --slot "$AZURE_BACKEND_SLOT_NAME" \
          --slot-settings "${BUILD_SETTINGS[@]}" \
          --output none

        echo "Deploy build settings applied."

    - name: Deploy backend package to staging slot
      if: ${{ steps.stale_guard.outputs.stale_run != '1' && steps.backend_deploy_mode.outputs.use_blue_green == '1' }}
      env:
        AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
        AZURE_BACKEND_RESOURCE_GROUP: ${{ vars.AZURE_BACKEND_RESOURCE_GROUP }}
        AZURE_BACKEND_SLOT_NAME: ${{ vars.AZURE_BACKEND_SLOT_NAME }}
      run: |
        SLOT_RESTARTED=0
        for attempt in $(seq 1 36); do
          set +e
          DEPLOY_OUTPUT=$(az webapp deploy \
            --resource-group "$AZURE_BACKEND_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --slot "$AZURE_BACKEND_SLOT_NAME" \
            --src-path release.zip \
            --type zip \
            --async true \
            --track-status false \
            --timeout 1800000 2>&1)
          DEPLOY_EXIT=$?
          set -e

          echo "$DEPLOY_OUTPUT"

          if [ "$DEPLOY_EXIT" -eq 0 ]; then
            echo "Backend slot deployment accepted."
            exit 0
          fi

          if printf "%s" "$DEPLOY_OUTPUT" | grep -qi "Another deployment is in progress"; then
            if [ "$attempt" -eq 12 ] && [ "$SLOT_RESTARTED" -eq 0 ]; then
              echo "Staging slot lock persisted through 12 attempts; restarting slot once to clear stale deploy state."
              az webapp restart \
                --resource-group "$AZURE_BACKEND_RESOURCE_GROUP" \
                --name "$AZURE_WEBAPP_NAME" \
                --slot "$AZURE_BACKEND_SLOT_NAME"
              SLOT_RESTARTED=1
              echo "Restarted staging slot; waiting 40s before retrying deploy."
              sleep 40
              continue
            fi

            echo "Backend slot deployment locked by another deployment (attempt $attempt/36). Retrying in 20s..."
            sleep 20
            continue
          fi

          echo "Backend slot deploy failed with a non-retryable error."
          exit "$DEPLOY_EXIT"
        done

        echo "Backend slot deploy did not obtain deployment lock after retries."
        exit 1

    - name: Wait for staging slot health before swap
      if: ${{ steps.stale_guard.outputs.stale_run != '1' && steps.backend_deploy_mode.outputs.use_blue_green == '1' }}
      env:
        AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
        AZURE_BACKEND_SLOT_NAME: ${{ vars.AZURE_BACKEND_SLOT_NAME }}
        BACKEND_SLOT_BASE_URL: ${{ vars.BACKEND_SLOT_BASE_URL }}
      run: |
        SLOT_URL="${BACKEND_SLOT_BASE_URL}"
        if [ -z "$SLOT_URL" ]; then
          SLOT_URL="https://${AZURE_WEBAPP_NAME}-${AZURE_BACKEND_SLOT_NAME}.azurewebsites.net"
        fi

        STARTUP_HEALTH_URL="$SLOT_URL/api/v1/health/startup"
        BASIC_HEALTH_URL="$SLOT_URL/api/v1/health"
        echo "Waiting for slot readiness at $STARTUP_HEALTH_URL (fallback $BASIC_HEALTH_URL)"

        for attempt in $(seq 1 60); do
          STARTUP_STATUS="$(curl -sS -o /dev/null -w "%{http_code}" "$STARTUP_HEALTH_URL" || true)"
          BASIC_STATUS="$(curl -sS -o /dev/null -w "%{http_code}" "$BASIC_HEALTH_URL" || true)"

          if [ "$STARTUP_STATUS" = "200" ] || [ "$BASIC_STATUS" = "200" ]; then
            echo "Staging slot is ready (attempt $attempt)."
            exit 0
          fi

          echo "Staging slot not ready yet (attempt $attempt, startup=$STARTUP_STATUS, health=$BASIC_STATUS)."
          sleep 10
        done

        echo "::error::Staging slot health did not return 200 within timeout."
        exit 1

    - name: Run staging slot core compliance smokes
      if: ${{ steps.stale_guard.outputs.stale_run != '1' && steps.backend_deploy_mode.outputs.use_blue_green == '1' }}
      env:
        AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
        AZURE_BACKEND_SLOT_NAME: ${{ vars.AZURE_BACKEND_SLOT_NAME }}
        BACKEND_SLOT_BASE_URL: ${{ vars.BACKEND_SLOT_BASE_URL }}
        RSVP_TEST_TOKEN: ${{ secrets.RSVP_TEST_TOKEN }}
        E2E_API_BASE_URL: ${{ vars.E2E_API_BASE_URL }}
        E2E_APP_URL: ${{ vars.E2E_APP_URL }}
        AZURE_B2C_ROPC_POLICY: ${{ vars.AZURE_B2C_ROPC_POLICY }}
        AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
        AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        VITE_API_SCOPE: ${{ vars.VITE_API_SCOPE }}
        AZURE_EXTERNAL_TENANT_NAME: ${{ vars.AZURE_EXTERNAL_TENANT_NAME }}
        AZURE_EXTERNAL_TENANT_ID: ${{ vars.AZURE_EXTERNAL_TENANT_ID }}
        AZURE_AUTHORITY_HOST: ${{ vars.AZURE_AUTHORITY_HOST }}
        PW_ADMIN_USER: ${{ secrets.PW_ADMIN_USER }}
        PW_ADMIN_PASS: ${{ secrets.PW_ADMIN_PASS }}
        PW_ADMIN_TOKEN: ${{ secrets.PW_ADMIN_TOKEN }}
        GUEST_ASSIGNMENTS_SMOKE_EVENT_ID: ${{ vars.GUEST_ASSIGNMENTS_SMOKE_EVENT_ID }}
        REDIS_SMOKE_EXPECT_PROVIDER: redis
        REDIS_SMOKE_REQUIRE_CONFIGURED: '1'
        REDIS_SMOKE_REQUIRE_CONNECTED: '1'
      run: |
        SLOT_URL="${BACKEND_SLOT_BASE_URL}"
        if [ -z "$SLOT_URL" ]; then
          SLOT_URL="https://${AZURE_WEBAPP_NAME}-${AZURE_BACKEND_SLOT_NAME}.azurewebsites.net"
        fi

        export BACKEND_BASE_URL="$SLOT_URL"

        # Email unsubscribe smoke is a hard gate
        npm --prefix backend run smoke:email

        # RSVP contract-only check (no live token required) is a hard gate
        npm --prefix backend run smoke:rsvp

        # Redis health check is a hard gate before slot swap.
        npm --prefix backend run smoke:redis

        # Live RSVP token check is best-effort; prefer a freshly minted token.
        LIVE_RSVP_TOKEN="${RSVP_TEST_TOKEN:-}"

        if [ -n "${PW_ADMIN_USER:-}" ] && [ -n "${PW_ADMIN_PASS:-}" ] && [ -n "${E2E_APP_URL:-}" ]; then
          TOKEN_ENV_FILE="$(mktemp)"
          echo "Refreshing admin auth token before live RSVP smoke..."
          PW_TOKEN_ENV_FILE="$TOKEN_ENV_FILE" npm run e2e:refresh-tokens -- --soft-skip || true
          if [ -s "$TOKEN_ENV_FILE" ]; then
            # shellcheck disable=SC1090
            . "$TOKEN_ENV_FILE"
          fi
          rm -f "$TOKEN_ENV_FILE"
        fi

        # Guest assignment load check is a hard gate before slot swap.
        npm --prefix backend run smoke:guest-assignments

        if [ -n "${PW_ADMIN_TOKEN:-}" ]; then
          MINT_ENDPOINT="${BACKEND_BASE_URL}/api/v1/events/rsvp/smoke-token"
          echo "Minting fresh RSVP token from ${MINT_ENDPOINT}..."
          set +e
          MINT_RESPONSE="$(curl -fsS -X POST "$MINT_ENDPOINT" \
            -H "Authorization: Bearer ${PW_ADMIN_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{}')"
          MINT_EXIT=$?
          set -e
          if [ "$MINT_EXIT" -eq 0 ] && [ -n "$MINT_RESPONSE" ]; then
            MINTED_TOKEN="$(printf '%s' "$MINT_RESPONSE" | python -c "import json,sys; data=json.load(sys.stdin); print((data.get('token') or '').strip())")"
            if [ -n "$MINTED_TOKEN" ]; then
              LIVE_RSVP_TOKEN="$MINTED_TOKEN"
              echo "Using freshly minted RSVP token for live smoke."
            fi
          else
            echo "::warning::Unable to mint fresh RSVP token; falling back to RSVP_TEST_TOKEN."
          fi
        fi

        if [ -n "$LIVE_RSVP_TOKEN" ]; then
          set +e
          RSVP_TEST_ENABLE_LIVE=1 RSVP_TEST_LIGHTWEIGHT=1 RSVP_TEST_TOKEN="$LIVE_RSVP_TOKEN" npm --prefix backend run smoke:rsvp
          RSVP_EXIT=$?
          set -e
          if [ "$RSVP_EXIT" -ne 0 ]; then
            echo "::warning::Live RSVP token smoke failed (fresh token attempt did not pass). Deploy will proceed."
          fi
        else
          echo "::warning::No RSVP token available; skipping live RSVP smoke."
        fi

    - name: Swap staging slot to production
      if: ${{ steps.stale_guard.outputs.stale_run != '1' && steps.backend_deploy_mode.outputs.use_blue_green == '1' }}
      env:
        AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
        AZURE_BACKEND_RESOURCE_GROUP: ${{ vars.AZURE_BACKEND_RESOURCE_GROUP }}
        AZURE_BACKEND_SLOT_NAME: ${{ vars.AZURE_BACKEND_SLOT_NAME }}
      run: |
        # Check for stale swap operations from prior cancelled runs
        for pre_check in $(seq 1 10); do
          SITE_STATE=$(az webapp show \
            --resource-group "$AZURE_BACKEND_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --query "state" -o tsv 2>/dev/null || echo "unknown")
          if [ "$SITE_STATE" = "Running" ]; then
            break
          fi
          echo "Waiting for site to be in Running state (current: $SITE_STATE, check $pre_check/10)..."
          sleep 15
        done

        for attempt in $(seq 1 5); do
          set +e
          # No timeout wrapper: let az CLI run to completion.
          # The job-level timeout-minutes is the safety net.
          SWAP_OUTPUT=$(az webapp deployment slot swap \
            --resource-group "$AZURE_BACKEND_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --slot "$AZURE_BACKEND_SLOT_NAME" \
            --target-slot production 2>&1)
          SWAP_EXIT=$?
          set -e

          echo "$SWAP_OUTPUT"

          if [ "$SWAP_EXIT" -eq 0 ]; then
            echo "Slot swap completed."
            exit 0
          fi

          if printf "%s" "$SWAP_OUTPUT" | grep -Eqi "in progress|conflict"; then
            echo "Another operation is in progress (attempt $attempt/5). Waiting 60s for it to clear..."
            sleep 60
            continue
          fi

          echo "Slot swap failed with a non-retryable error."
          exit "$SWAP_EXIT"
        done

        echo "Slot swap did not complete after retries."
        exit 1

    - name: Wait for production health after swap
      id: post_swap_health
      if: ${{ steps.stale_guard.outputs.stale_run != '1' && steps.backend_deploy_mode.outputs.use_blue_green == '1' }}
      continue-on-error: true
      env:
        AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
        BACKEND_BASE_URL: ${{ vars.BACKEND_BASE_URL }}
      run: |
        PROD_URL="${BACKEND_BASE_URL}"
        if [ -z "$PROD_URL" ]; then
          PROD_URL="https://${AZURE_WEBAPP_NAME}.azurewebsites.net"
        fi

        STARTUP_HEALTH_URL="$PROD_URL/api/v1/health/startup"
        BASIC_HEALTH_URL="$PROD_URL/api/v1/health"

        for attempt in $(seq 1 24); do
          STARTUP_STATUS="$(curl -sS -o /dev/null -w "%{http_code}" "$STARTUP_HEALTH_URL" || true)"
          BASIC_STATUS="$(curl -sS -o /dev/null -w "%{http_code}" "$BASIC_HEALTH_URL" || true)"

          if [ "$STARTUP_STATUS" = "200" ] || [ "$BASIC_STATUS" = "200" ]; then
            echo "Production health is ready (attempt $attempt)."
            exit 0
          fi

          echo "Production not ready yet (attempt $attempt, startup=$STARTUP_STATUS, health=$BASIC_STATUS)."
          sleep 10
        done

        echo "::error::Production health did not return 200 after swap."
        exit 1

    - name: Run production core smokes after swap
      id: post_swap_smoke
      if: ${{ steps.stale_guard.outputs.stale_run != '1' && steps.backend_deploy_mode.outputs.use_blue_green == '1' }}
      continue-on-error: true
      env:
        AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
        BACKEND_BASE_URL: ${{ vars.BACKEND_BASE_URL }}
        RSVP_TEST_TOKEN: ${{ secrets.RSVP_TEST_TOKEN }}
        E2E_API_BASE_URL: ${{ vars.E2E_API_BASE_URL }}
        E2E_APP_URL: ${{ vars.E2E_APP_URL }}
        AZURE_B2C_ROPC_POLICY: ${{ vars.AZURE_B2C_ROPC_POLICY }}
        AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
        AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        VITE_API_SCOPE: ${{ vars.VITE_API_SCOPE }}
        AZURE_EXTERNAL_TENANT_NAME: ${{ vars.AZURE_EXTERNAL_TENANT_NAME }}
        AZURE_EXTERNAL_TENANT_ID: ${{ vars.AZURE_EXTERNAL_TENANT_ID }}
        AZURE_AUTHORITY_HOST: ${{ vars.AZURE_AUTHORITY_HOST }}
        PW_ADMIN_USER: ${{ secrets.PW_ADMIN_USER }}
        PW_ADMIN_PASS: ${{ secrets.PW_ADMIN_PASS }}
        PW_ADMIN_TOKEN: ${{ secrets.PW_ADMIN_TOKEN }}
      run: |
        PROD_URL="${BACKEND_BASE_URL}"
        if [ -z "$PROD_URL" ]; then
          PROD_URL="https://${AZURE_WEBAPP_NAME}.azurewebsites.net"
        fi

        export BACKEND_BASE_URL="$PROD_URL"

        # Email unsubscribe smoke is a hard gate
        npm --prefix backend run smoke:email

        # RSVP contract-only check is a hard gate
        npm --prefix backend run smoke:rsvp

        # Live RSVP token check is best-effort; prefer a freshly minted token.
        LIVE_RSVP_TOKEN="${RSVP_TEST_TOKEN:-}"

        if [ -n "${PW_ADMIN_USER:-}" ] && [ -n "${PW_ADMIN_PASS:-}" ] && [ -n "${E2E_APP_URL:-}" ]; then
          TOKEN_ENV_FILE="$(mktemp)"
          echo "Refreshing admin auth token before live RSVP smoke..."
          PW_TOKEN_ENV_FILE="$TOKEN_ENV_FILE" npm run e2e:refresh-tokens -- --soft-skip || true
          if [ -s "$TOKEN_ENV_FILE" ]; then
            # shellcheck disable=SC1090
            . "$TOKEN_ENV_FILE"
          fi
          rm -f "$TOKEN_ENV_FILE"
        fi

        if [ -n "${PW_ADMIN_TOKEN:-}" ]; then
          MINT_ENDPOINT="${BACKEND_BASE_URL}/api/v1/events/rsvp/smoke-token"
          echo "Minting fresh RSVP token from ${MINT_ENDPOINT}..."
          set +e
          MINT_RESPONSE="$(curl -fsS -X POST "$MINT_ENDPOINT" \
            -H "Authorization: Bearer ${PW_ADMIN_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{}')"
          MINT_EXIT=$?
          set -e
          if [ "$MINT_EXIT" -eq 0 ] && [ -n "$MINT_RESPONSE" ]; then
            MINTED_TOKEN="$(printf '%s' "$MINT_RESPONSE" | python -c "import json,sys; data=json.load(sys.stdin); print((data.get('token') or '').strip())")"
            if [ -n "$MINTED_TOKEN" ]; then
              LIVE_RSVP_TOKEN="$MINTED_TOKEN"
              echo "Using freshly minted RSVP token for live smoke."
            fi
          else
            echo "::warning::Unable to mint fresh RSVP token; falling back to RSVP_TEST_TOKEN."
          fi
        fi

        if [ -n "$LIVE_RSVP_TOKEN" ]; then
          set +e
          RSVP_TEST_ENABLE_LIVE=1 RSVP_TEST_LIGHTWEIGHT=1 RSVP_TEST_TOKEN="$LIVE_RSVP_TOKEN" npm --prefix backend run smoke:rsvp
          RSVP_EXIT=$?
          set -e
          if [ "$RSVP_EXIT" -ne 0 ]; then
            echo "::warning::Live RSVP token smoke failed (fresh token attempt did not pass)."
          fi
        else
          echo "::warning::No RSVP token available; skipping live RSVP smoke."
        fi

    - name: Auto-rollback swap back on post-swap failure
      if: ${{ steps.stale_guard.outputs.stale_run != '1' && steps.backend_deploy_mode.outputs.use_blue_green == '1' && (steps.post_swap_health.outcome == 'failure' || steps.post_swap_smoke.outcome == 'failure') }}
      env:
        AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
        AZURE_BACKEND_RESOURCE_GROUP: ${{ vars.AZURE_BACKEND_RESOURCE_GROUP }}
        AZURE_BACKEND_SLOT_NAME: ${{ vars.AZURE_BACKEND_SLOT_NAME }}
      run: |
        echo "Post-swap validation failed; swapping back to previous production slot."
        for attempt in $(seq 1 5); do
          set +e
          ROLLBACK_OUTPUT=$(az webapp deployment slot swap \
            --resource-group "$AZURE_BACKEND_RESOURCE_GROUP" \
            --name "$AZURE_WEBAPP_NAME" \
            --slot "$AZURE_BACKEND_SLOT_NAME" \
            --target-slot production 2>&1)
          ROLLBACK_EXIT=$?
          set -e

          echo "$ROLLBACK_OUTPUT"

          if [ "$ROLLBACK_EXIT" -eq 0 ]; then
            echo "Rollback swap completed."
            exit 0
          fi

          if printf "%s" "$ROLLBACK_OUTPUT" | grep -Eqi "in progress|conflict"; then
            echo "Rollback swap blocked by in-progress operation (attempt $attempt/5). Waiting 60s..."
            sleep 60
            continue
          fi

          echo "Rollback swap failed with a non-retryable error."
          exit "$ROLLBACK_EXIT"
        done

        echo "Rollback swap did not complete after retries."
        exit 1

    - name: Fail deploy after rollback
      if: ${{ steps.stale_guard.outputs.stale_run != '1' && steps.backend_deploy_mode.outputs.use_blue_green == '1' && (steps.post_swap_health.outcome == 'failure' || steps.post_swap_smoke.outcome == 'failure') }}
      run: |
        echo "::error::Blue-green deploy swapped to production but post-swap checks failed. Auto-rollback executed."
        exit 1

    - name: Deploy to Azure via Kudu zipdeploy
      if: ${{ steps.stale_guard.outputs.stale_run != '1' && steps.backend_deploy_mode.outputs.use_blue_green != '1' }}
      env:
        AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
        AZUREAPPSERVICE_PUBLISHPROFILE: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
      run: |
        if [ -z "$AZUREAPPSERVICE_PUBLISHPROFILE" ]; then
          echo "AZUREAPPSERVICE_PUBLISHPROFILE is required"
          exit 1
        fi

        PROFILE_LINE=$(python -c "import os,xml.etree.ElementTree as ET; raw=os.environ.get('AZUREAPPSERVICE_PUBLISHPROFILE','').strip(); root=ET.fromstring(raw) if raw else (_ for _ in ()).throw(SystemExit('Missing AZUREAPPSERVICE_PUBLISHPROFILE')); profiles=root.findall('.//publishProfile'); profiles or (_ for _ in ()).throw(SystemExit('No publishProfile entries found')); chosen=next((p for p in profiles if (p.attrib.get('publishMethod') or '').lower()=='msdeploy'), profiles[0]); publish_url=(chosen.attrib.get('publishUrl') or '').split(',')[0].strip(); scm_url=publish_url if publish_url.startswith('http://') or publish_url.startswith('https://') else 'https://' + publish_url; host=scm_url.split('//',1)[-1].split(':',1)[0]; scm_url='https://' + host; username=(chosen.attrib.get('userName') or '').strip(); password=(chosen.attrib.get('userPWD') or '').strip(); (username and password and scm_url) or (_ for _ in ()).throw(SystemExit('Publish profile is missing required credentials or URL')); print('\t'.join([scm_url, username, password]))")

        IFS=$'\t' read -r SCM_URL KUDU_USER KUDU_PASS <<< "$PROFILE_LINE"

        if [ -z "$SCM_URL" ] || [ -z "$KUDU_USER" ] || [ -z "$KUDU_PASS" ]; then
          echo "Failed to parse publish profile credentials"
          exit 1
        fi

        echo "Deploying release.zip to $AZURE_WEBAPP_NAME via $SCM_URL"

        get_latest_deploy_status() {
          curl -fsS -u "$KUDU_USER:$KUDU_PASS" "$SCM_URL/api/deployments/latest" 2>/dev/null | python -c "import json,sys; txt=sys.stdin.read().strip(); data=(json.loads(txt) if txt else {}); status=data.get('status') if isinstance(data, dict) else None; dep_id=(data.get('id') or '') if isinstance(data, dict) else ''; msg=(data.get('status_text') or data.get('message') or '') if isinstance(data, dict) else ''; msg=str(msg).replace('\\n',' ').strip(); normalized=('unknown' if not txt else ('none' if status is None else status)); print('%s\\t%s\\t%s' % (normalized, dep_id, msg))" 2>/dev/null || printf "unknown\t\t"
        }

        wait_for_kudu_idle() {
          MAX_ATTEMPTS="${1:-60}"
          SLEEP_SECONDS="${2:-10}"
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            LATEST=$(get_latest_deploy_status)
            DEPLOY_STATUS=$(printf "%s" "$LATEST" | cut -f1)
            DEPLOY_ID=$(printf "%s" "$LATEST" | cut -f2)
            DEPLOY_MSG=$(printf "%s" "$LATEST" | cut -f3-)

            if [ "$DEPLOY_STATUS" = "0" ] || [ "$DEPLOY_STATUS" = "1" ]; then
              echo "Existing deployment in progress (status=$DEPLOY_STATUS id=$DEPLOY_ID), waiting... ($attempt/$MAX_ATTEMPTS)"
              if [ -n "$DEPLOY_MSG" ]; then
                echo "Latest deploy message: $DEPLOY_MSG"
              fi
              sleep "$SLEEP_SECONDS"
              continue
            fi

            echo "Kudu ready for zipdeploy (latest status=$DEPLOY_STATUS id=$DEPLOY_ID)."
            return 0
          done

          echo "Kudu stayed busy too long; proceeding to zipdeploy retries."
          return 0
        }

        wait_for_kudu_idle 60 10

        STATUS_URL=""
        for attempt in $(seq 1 40); do
          RESPONSE_HEADERS=$(mktemp)
          RESPONSE_BODY=$(mktemp)

          HTTP_CODE=$(curl -sS -u "$KUDU_USER:$KUDU_PASS" \
            -X POST "$SCM_URL/api/zipdeploy?isAsync=true" \
            --data-binary @release.zip \
            -D "$RESPONSE_HEADERS" \
            -o "$RESPONSE_BODY" \
            -w "%{http_code}" || printf "000")

          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "202" ]; then
            STATUS_URL=$(awk 'BEGIN{IGNORECASE=1} /^Location:/ {gsub("\r","",$2); print $2}' "$RESPONSE_HEADERS" | tail -n 1)
            if [ -z "$STATUS_URL" ]; then
              STATUS_URL="$SCM_URL/api/deployments/latest"
            fi
            rm -f "$RESPONSE_HEADERS" "$RESPONSE_BODY"
            break
          fi

          if [ "$HTTP_CODE" = "409" ]; then
            echo "zipdeploy conflict (HTTP 409), waiting before retry... ($attempt/40)"
            rm -f "$RESPONSE_HEADERS" "$RESPONSE_BODY"
            wait_for_kudu_idle 12 10
            continue
          fi

          echo "zipdeploy request failed with HTTP $HTTP_CODE"
          echo "Response body:"
          cat "$RESPONSE_BODY"
          rm -f "$RESPONSE_HEADERS" "$RESPONSE_BODY"
          exit 1
        done

        if [ -z "$STATUS_URL" ]; then
          echo "Latest deployment status from Kudu before exit:"
          get_latest_deploy_status
          echo "zipdeploy did not return a status URL after retries"
          exit 1
        fi

        echo "Polling deployment status from: $STATUS_URL"

        for poll in $(seq 1 90); do
          STATUS_AND_MESSAGE=$(curl -fsS -u "$KUDU_USER:$KUDU_PASS" "$STATUS_URL" | python -c "import json,sys; data=json.load(sys.stdin); status=data.get('status'); msg=(data.get('status_text') or data.get('message') or '').replace('\\n',' ').strip(); print('{}\\t{}'.format('none' if status is None else status, msg))")

          DEPLOY_STATE=$(printf "%s" "$STATUS_AND_MESSAGE" | cut -f1)
          DEPLOY_MSG=$(printf "%s" "$STATUS_AND_MESSAGE" | cut -f2-)
          echo "Deploy state=$DEPLOY_STATE message=$DEPLOY_MSG"

          if [ "$DEPLOY_STATE" = "4" ]; then
            echo "Deployment succeeded"
            exit 0
          fi

          if [ "$DEPLOY_STATE" = "3" ]; then
            echo "Deployment failed"
            exit 1
          fi

          sleep 10
        done

        echo "Deployment status polling timed out"
        exit 1

  deploy_frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    permissions:
      contents: read
      id-token: write
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.AZURE_FRONTEND_RESOURCE_GROUP != '' &&
      vars.AZURE_FRONTEND_WEBAPP_NAME != '' &&
      vars.VITE_EXTERNAL_CLIENT_ID != '' &&
      vars.VITE_EXTERNAL_TENANT_ID != '' &&
      vars.VITE_EXTERNAL_TENANT_NAME != '' &&
      vars.VITE_API_SCOPE != '' &&
      vars.VITE_API_BASE_URL != ''
    concurrency:
      group: azure-frontend-deploy-${{ github.ref_name }}
      cancel-in-progress: false

    steps:
    - uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      run: cd frontend && npm ci

    - name: Build frontend
      env:
        VITE_EXTERNAL_CLIENT_ID: ${{ vars.VITE_EXTERNAL_CLIENT_ID }}
        VITE_EXTERNAL_TENANT_ID: ${{ vars.VITE_EXTERNAL_TENANT_ID }}
        VITE_EXTERNAL_TENANT_NAME: ${{ vars.VITE_EXTERNAL_TENANT_NAME }}
        VITE_API_SCOPE: ${{ vars.VITE_API_SCOPE }}
        VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
        VITE_E2E_EXTERNAL_AUTH: '1'
      run: cd frontend && npm run build

    - name: Package frontend artifact
      run: cd frontend/dist && zip -r ../../frontend-release.zip .

    - name: Azure CLI login (frontend deploy)
      env:
        AZURE_FRONTEND_DEPLOY_CREDENTIALS: ${{ secrets.AZURE_FRONTEND_DEPLOY_CREDENTIALS }}
      run: |
        if [ -z "$AZURE_FRONTEND_DEPLOY_CREDENTIALS" ]; then
          echo "AZURE_FRONTEND_DEPLOY_CREDENTIALS is required"
          exit 1
        fi

        AZ_LINE=$(python -c "import json,os; creds=json.loads(os.environ['AZURE_FRONTEND_DEPLOY_CREDENTIALS']); print('\\t'.join([creds.get('clientId',''), creds.get('clientSecret',''), creds.get('tenantId',''), creds.get('subscriptionId','')]))")

        IFS=$'\t' read -r AZ_CLIENT_ID AZ_CLIENT_SECRET AZ_TENANT_ID AZ_SUBSCRIPTION_ID <<< "$AZ_LINE"

        if [ -z "$AZ_CLIENT_ID" ] || [ -z "$AZ_CLIENT_SECRET" ] || [ -z "$AZ_TENANT_ID" ] || [ -z "$AZ_SUBSCRIPTION_ID" ]; then
          echo "AZURE_FRONTEND_DEPLOY_CREDENTIALS is missing required fields"
          exit 1
        fi

        for attempt in $(seq 1 5); do
          set +e
          LOGIN_OUTPUT=$(timeout 120 az login --service-principal \
            --username "$AZ_CLIENT_ID" \
            --password "$AZ_CLIENT_SECRET" \
            --tenant "$AZ_TENANT_ID" \
            --output none 2>&1)
          LOGIN_EXIT=$?
          set -e

          echo "$LOGIN_OUTPUT"

          if [ "$LOGIN_EXIT" -eq 0 ]; then
            az account set --subscription "$AZ_SUBSCRIPTION_ID"
            echo "Azure frontend login succeeded."
            exit 0
          fi

          if [ "$LOGIN_EXIT" -eq 124 ] || printf "%s" "$LOGIN_OUTPUT" | grep -Eqi "timed out|timeout|temporarily unavailable|connection|EOF|unreachable"; then
            echo "Azure frontend login transient failure (attempt $attempt/5). Retrying in 15s..."
            sleep 15
            continue
          fi

          echo "Azure frontend login failed with a non-retryable error."
          exit "$LOGIN_EXIT"
        done

        echo "Azure frontend login failed after retries."
        exit 1

    - name: Deploy frontend to Azure
      run: |
        for attempt in $(seq 1 18); do
          set +e
          DEPLOY_OUTPUT=$(az webapp deploy \
            --resource-group "${{ vars.AZURE_FRONTEND_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_FRONTEND_WEBAPP_NAME }}" \
            --src-path frontend-release.zip \
            --type zip \
            --async true \
            --track-status false \
            --timeout 1800000 2>&1)
          DEPLOY_EXIT=$?
          set -e

          echo "$DEPLOY_OUTPUT"

          if [ "$DEPLOY_EXIT" -eq 0 ]; then
            echo "Frontend deployment accepted."
            exit 0
          fi

          if printf "%s" "$DEPLOY_OUTPUT" | grep -qi "Another deployment is in progress"; then
            echo "Frontend deployment locked by another deployment (attempt $attempt/18). Retrying in 20s..."
            sleep 20
            continue
          fi

          echo "Frontend deploy failed with a non-retryable error."
          exit "$DEPLOY_EXIT"
        done

        echo "Frontend deploy did not obtain deployment lock after retries."
        exit 1

  deploy_backend_smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: deploy
    permissions:
      contents: read
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AZURE_WEBAPP_NAME != ''

    steps:
    - uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json

    - name: Install backend dependencies
      run: cd backend && npm ci

    - name: Wait for backend health before smoke
      run: |
        BACKEND_BASE_URL="${{ vars.BACKEND_BASE_URL }}"
        if [ -z "$BACKEND_BASE_URL" ]; then
          BACKEND_BASE_URL="https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net"
        fi
        STARTUP_HEALTH_URL="$BACKEND_BASE_URL/api/v1/health/startup"
        BASIC_HEALTH_URL="$BACKEND_BASE_URL/api/v1/health"
        echo "Waiting for backend readiness at $STARTUP_HEALTH_URL (fallback $BASIC_HEALTH_URL)"

        for attempt in $(seq 1 36); do
          STARTUP_STATUS="$(curl -sS -o /dev/null -w "%{http_code}" "$STARTUP_HEALTH_URL" || true)"
          BASIC_STATUS="$(curl -sS -o /dev/null -w "%{http_code}" "$BASIC_HEALTH_URL" || true)"

          if [ "$STARTUP_STATUS" = "200" ] || [ "$BASIC_STATUS" = "200" ]; then
            echo "Backend is ready (attempt $attempt)."
            exit 0
          fi

          echo "Backend not ready yet (attempt $attempt, startup=$STARTUP_STATUS, health=$BASIC_STATUS)."
          sleep 10
        done

        echo "::error::Backend health endpoint did not return 200 within timeout (startup + health checked)."
        exit 1

    - name: Run post-deploy core compliance smokes
      env:
        RSVP_TEST_TOKEN: ${{ secrets.RSVP_TEST_TOKEN }}
        E2E_API_BASE_URL: ${{ vars.E2E_API_BASE_URL }}
        E2E_APP_URL: ${{ vars.E2E_APP_URL }}
        AZURE_B2C_ROPC_POLICY: ${{ vars.AZURE_B2C_ROPC_POLICY }}
        AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
        AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        VITE_API_SCOPE: ${{ vars.VITE_API_SCOPE }}
        AZURE_EXTERNAL_TENANT_NAME: ${{ vars.AZURE_EXTERNAL_TENANT_NAME }}
        AZURE_EXTERNAL_TENANT_ID: ${{ vars.AZURE_EXTERNAL_TENANT_ID }}
        AZURE_AUTHORITY_HOST: ${{ vars.AZURE_AUTHORITY_HOST }}
        PW_ADMIN_USER: ${{ secrets.PW_ADMIN_USER }}
        PW_ADMIN_PASS: ${{ secrets.PW_ADMIN_PASS }}
        PW_ADMIN_TOKEN: ${{ secrets.PW_ADMIN_TOKEN }}
      run: |
        set -o pipefail
        mkdir -p ci-artifacts
        BACKEND_BASE_URL="${{ vars.BACKEND_BASE_URL }}"
        if [ -z "$BACKEND_BASE_URL" ]; then
          BACKEND_BASE_URL="https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net"
        fi
        echo "Running core compliance smokes against $BACKEND_BASE_URL"
        export BACKEND_BASE_URL

        # Email unsubscribe smoke is a hard gate
        npm --prefix backend run smoke:email 2>&1 | tee -a ci-artifacts/deploy-backend-smoke.log

        # RSVP contract-only check (no live token required) is a hard gate
        npm --prefix backend run smoke:rsvp 2>&1 | tee -a ci-artifacts/deploy-backend-smoke.log

        # Redis health check validates distributed cache readiness when enabled.
        npm --prefix backend run smoke:redis 2>&1 | tee -a ci-artifacts/deploy-backend-smoke.log

        # Live RSVP token check is best-effort; prefer a freshly minted token.
        LIVE_RSVP_TOKEN="${RSVP_TEST_TOKEN:-}"

        if [ -n "${PW_ADMIN_USER:-}" ] && [ -n "${PW_ADMIN_PASS:-}" ] && [ -n "${E2E_APP_URL:-}" ]; then
          TOKEN_ENV_FILE="$(mktemp)"
          echo "Refreshing admin auth token before live RSVP smoke..." | tee -a ci-artifacts/deploy-backend-smoke.log
          PW_TOKEN_ENV_FILE="$TOKEN_ENV_FILE" npm run e2e:refresh-tokens -- --soft-skip 2>&1 | tee -a ci-artifacts/deploy-backend-smoke.log || true
          if [ -s "$TOKEN_ENV_FILE" ]; then
            # shellcheck disable=SC1090
            . "$TOKEN_ENV_FILE"
          fi
          rm -f "$TOKEN_ENV_FILE"
        fi

        if [ -n "${PW_ADMIN_TOKEN:-}" ]; then
          MINT_ENDPOINT="${BACKEND_BASE_URL}/api/v1/events/rsvp/smoke-token"
          echo "Minting fresh RSVP token from ${MINT_ENDPOINT}..." | tee -a ci-artifacts/deploy-backend-smoke.log
          set +e
          MINT_RESPONSE="$(curl -fsS -X POST "$MINT_ENDPOINT" \
            -H "Authorization: Bearer ${PW_ADMIN_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{}')"
          MINT_EXIT=$?
          set -e
          if [ "$MINT_EXIT" -eq 0 ] && [ -n "$MINT_RESPONSE" ]; then
            MINTED_TOKEN="$(printf '%s' "$MINT_RESPONSE" | python -c "import json,sys; data=json.load(sys.stdin); print((data.get('token') or '').strip())")"
            if [ -n "$MINTED_TOKEN" ]; then
              LIVE_RSVP_TOKEN="$MINTED_TOKEN"
              echo "Using freshly minted RSVP token for live smoke." | tee -a ci-artifacts/deploy-backend-smoke.log
            fi
          else
            echo "::warning::Unable to mint fresh RSVP token; falling back to RSVP_TEST_TOKEN." | tee -a ci-artifacts/deploy-backend-smoke.log
          fi
        fi

        if [ -n "$LIVE_RSVP_TOKEN" ]; then
          set +e
          RSVP_TEST_ENABLE_LIVE=1 RSVP_TEST_LIGHTWEIGHT=1 RSVP_TEST_TOKEN="$LIVE_RSVP_TOKEN" npm --prefix backend run smoke:rsvp 2>&1 | tee -a ci-artifacts/deploy-backend-smoke.log
          RSVP_EXIT=$?
          set -e
          if [ "$RSVP_EXIT" -ne 0 ]; then
            echo "::warning::Live RSVP token smoke failed (fresh token attempt did not pass). Deploy will proceed." | tee -a ci-artifacts/deploy-backend-smoke.log
          fi
        else
          echo "::warning::No RSVP token available; skipping live RSVP smoke." | tee -a ci-artifacts/deploy-backend-smoke.log
        fi

    - name: Run post-deploy SMS compliance smoke (optional)
      id: sms_smoke
      if: ${{ vars.SMS_SMOKE_ENABLED == '1' || vars.SMS_COMPLIANCE_REQUIRED == '1' }}
      continue-on-error: ${{ vars.SMS_COMPLIANCE_REQUIRED != '1' }}
      run: |
        mkdir -p ci-artifacts
        BACKEND_BASE_URL="${{ vars.BACKEND_BASE_URL }}"
        if [ -z "$BACKEND_BASE_URL" ]; then
          BACKEND_BASE_URL="https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net"
        fi
        SMS_TEST_PHONE="${{ vars.SMS_TEST_PHONE }}"
        SMS_TEST_ENABLE_LIVE="${{ vars.SMS_TEST_ENABLE_LIVE }}"
        echo "Running SMS compliance smoke against $BACKEND_BASE_URL"
        export BACKEND_BASE_URL
        export SMS_TEST_PHONE
        export SMS_TEST_ENABLE_LIVE
        npm --prefix backend run smoke:sms 2>&1 | tee -a ci-artifacts/deploy-backend-smoke.log

    - name: Upload deploy backend smoke logs
      if: ${{ always() }}
      uses: actions/upload-artifact@v5
      with:
        name: deploy-backend-smoke-logs-${{ github.run_id }}
        if-no-files-found: ignore
        retention-days: 14
        path: ci-artifacts/deploy-backend-smoke.log

    - name: Warn when optional SMS smoke fails
      if: ${{ steps.sms_smoke.outcome == 'failure' && vars.SMS_COMPLIANCE_REQUIRED != '1' }}
      run: |
        echo "::warning::SMS compliance smoke failed but is configured as non-blocking."
        echo "::warning::Set SMS_COMPLIANCE_REQUIRED=1 to enforce SMS smoke as a required production gate."

    - name: Alert on compliance smoke failure
      if: ${{ failure() }}
      run: |
        WEBHOOK_URL="${{ secrets.COMPLIANCE_ALERT_WEBHOOK_URL }}"
        if [ -z "$WEBHOOK_URL" ]; then
          echo "COMPLIANCE_ALERT_WEBHOOK_URL is not configured; skipping webhook alert."
          exit 0
        fi

        RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        ALERT_PAYLOAD=$(cat <<EOF
        {
          "text": "[phw-alpine-events] Post-deploy compliance smoke failure on main. Run: ${RUN_URL} | SHA: ${{ github.sha }}"
        }
        EOF
        )

        curl -fsS -X POST \
          -H "Content-Type: application/json" \
          -d "$ALERT_PAYLOAD" \
          "$WEBHOOK_URL"

  deploy_frontend_smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
    - deploy
    - deploy_frontend
    permissions:
      contents: read
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: package-lock.json

    - name: Install Playwright smoke dependencies
      run: npm ci

    - name: Read Playwright version
      id: pw_version
      run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browsers
      id: pw_cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ms-playwright-${{ runner.os }}-${{ steps.pw_version.outputs.version }}-chromium

    - name: Install Playwright Chromium
      timeout-minutes: 15
      run: |
        if [ "${{ steps.pw_cache.outputs.cache-hit }}" = "true" ]; then
          npx playwright install-deps chromium
        else
          npx playwright install --with-deps chromium
        fi

    - name: Resolve browser smoke target
      id: smoke_target
      env:
        FRONTEND_SMOKE_REQUIRED: ${{ vars.FRONTEND_SMOKE_REQUIRED }}
        E2E_PUBLIC_APP_URL: ${{ vars.E2E_PUBLIC_APP_URL }}
        E2E_APP_URL: ${{ vars.E2E_APP_URL }}
        AZURE_FRONTEND_WEBAPP_NAME: ${{ vars.AZURE_FRONTEND_WEBAPP_NAME }}
      run: |
        REQUIRED="${FRONTEND_SMOKE_REQUIRED:-1}"

        TARGET_URL="${E2E_PUBLIC_APP_URL}"
        if [ -z "$TARGET_URL" ]; then
          TARGET_URL="https://app.phwcoloradoalpine.org"
        fi

        if ! curl -fsS --max-time 15 "$TARGET_URL" >/dev/null; then
          echo "::warning::Primary public smoke URL $TARGET_URL is not reachable; falling back."
          TARGET_URL="${E2E_APP_URL}"
        fi

        if [ -z "$TARGET_URL" ] && [ -n "$AZURE_FRONTEND_WEBAPP_NAME" ]; then
          TARGET_URL="https://${AZURE_FRONTEND_WEBAPP_NAME}.azurewebsites.net"
        fi

        if [ -z "$TARGET_URL" ]; then
          if [ "$REQUIRED" = "1" ]; then
            echo "::error::Frontend smoke is required but no target URL is available. Set vars.E2E_APP_URL or vars.AZURE_FRONTEND_WEBAPP_NAME."
            exit 1
          fi
          echo "run_browser_smoke=0" >> "$GITHUB_OUTPUT"
          echo "::warning::Skipping browser smoke because no target URL is configured."
          exit 0
        fi

        echo "target_url=$TARGET_URL" >> "$GITHUB_OUTPUT"
        echo "run_browser_smoke=1" >> "$GITHUB_OUTPUT"

    - name: Determine browser smoke readiness
      id: smoke_ready
      env:
        FRONTEND_SMOKE_REQUIRED: ${{ vars.FRONTEND_SMOKE_REQUIRED }}
        PW_MEMBER_USER: ${{ secrets.PW_MEMBER_USER }}
        PW_MEMBER_PASS: ${{ secrets.PW_MEMBER_PASS }}
      run: |
        REQUIRED="${FRONTEND_SMOKE_REQUIRED:-1}"
        if [ -n "$PW_MEMBER_USER" ] && [ -n "$PW_MEMBER_PASS" ]; then
          echo "ready=1" >> "$GITHUB_OUTPUT"
        else
          if [ "$REQUIRED" = "1" ]; then
            echo "::error::Frontend smoke is required but PW_MEMBER_USER/PW_MEMBER_PASS are not configured."
            exit 1
          fi
          echo "ready=0" >> "$GITHUB_OUTPUT"
          echo "::warning::Skipping browser smoke because PW_MEMBER_USER/PW_MEMBER_PASS are not configured and FRONTEND_SMOKE_REQUIRED is not 1."
        fi

    - name: Refresh member auth state for browser smoke
      if: ${{ steps.smoke_target.outputs.run_browser_smoke == '1' && steps.smoke_ready.outputs.ready == '1' }}
      env:
        E2E_APP_URL: ${{ steps.smoke_target.outputs.target_url }}
        PW_REFRESH_ROLE_TIMEOUT_MS: '90000'
        PW_MEMBER_USER: ${{ secrets.PW_MEMBER_USER }}
        PW_MEMBER_PASS: ${{ secrets.PW_MEMBER_PASS }}
      run: npm run e2e:refresh-tokens -- --soft-skip

    - name: Run post-deploy frontend browser smoke
      if: ${{ steps.smoke_target.outputs.run_browser_smoke == '1' && steps.smoke_ready.outputs.ready == '1' }}
      continue-on-error: true
      env:
        E2E_APP_URL: ${{ steps.smoke_target.outputs.target_url }}
        PW_MEMBER_USER: ${{ secrets.PW_MEMBER_USER }}
        PW_MEMBER_PASS: ${{ secrets.PW_MEMBER_PASS }}
      run: |
        set -o pipefail
        mkdir -p ci-artifacts
        npx playwright test tests/e2e/browser-postdeploy-smoke.spec.ts 2>&1 | tee -a ci-artifacts/deploy-frontend-smoke.log

    - name: Upload deploy frontend smoke logs
      if: ${{ always() }}
      uses: actions/upload-artifact@v5
      with:
        name: deploy-frontend-smoke-logs-${{ github.run_id }}
        if-no-files-found: ignore
        retention-days: 14
        path: ci-artifacts/deploy-frontend-smoke.log

  release_smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event_name == 'release' && github.event.action == 'published'

    steps:
    - uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json

    - name: Install backend dependencies
      run: cd backend && npm ci

    - name: Run release compliance smokes
      run: |
        BACKEND_BASE_URL="${{ vars.BACKEND_BASE_URL }}"
        if [ -z "$BACKEND_BASE_URL" ]; then
          BACKEND_BASE_URL="https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net"
        fi
        echo "Running release core compliance smokes against $BACKEND_BASE_URL"
        export BACKEND_BASE_URL
        npm --prefix backend run smoke:email
        npm --prefix backend run smoke:rsvp

    - name: Run release SMS compliance smoke (optional)
      if: ${{ vars.SMS_SMOKE_ENABLED == '1' || vars.SMS_COMPLIANCE_REQUIRED == '1' }}
      continue-on-error: ${{ vars.SMS_COMPLIANCE_REQUIRED != '1' }}
      run: |
        BACKEND_BASE_URL="${{ vars.BACKEND_BASE_URL }}"
        if [ -z "$BACKEND_BASE_URL" ]; then
          BACKEND_BASE_URL="https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net"
        fi
        SMS_TEST_PHONE="${{ vars.SMS_TEST_PHONE }}"
        SMS_TEST_ENABLE_LIVE="${{ vars.SMS_TEST_ENABLE_LIVE }}"
        echo "Running release SMS compliance smoke against $BACKEND_BASE_URL"
        export BACKEND_BASE_URL
        export SMS_TEST_PHONE
        export SMS_TEST_ENABLE_LIVE
        npm --prefix backend run smoke:sms