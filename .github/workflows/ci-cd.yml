name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: |
          frontend/package-lock.json
          backend/package-lock.json

    - name: Install frontend dependencies
      run: cd frontend && npm ci

    - name: Build frontend
      run: cd frontend && npm run build

    - name: Test frontend regression flows
      run: cd frontend && npm run test:flows

    - name: Install backend dependencies
      run: cd backend && npm ci

    - name: Build backend
      run: cd backend && npm run build

    - name: Test backend
      run: cd backend && npm test -- --runInBand

    - name: Install Playwright role-matrix dependencies
      if: ${{ github.event_name == 'push' && vars.E2E_API_BASE_URL != '' && secrets.PW_EVENT_CREATOR_TOKEN != '' }}
      run: npm ci

    - name: Run Playwright role matrix
      if: ${{ github.event_name == 'push' && vars.E2E_API_BASE_URL != '' && secrets.PW_EVENT_CREATOR_TOKEN != '' }}
      env:
        E2E_API_BASE_URL: ${{ vars.E2E_API_BASE_URL }}
        PW_EVENT_CREATOR_TOKEN: ${{ secrets.PW_EVENT_CREATOR_TOKEN }}
        PW_MEMBER_TOKEN: ${{ secrets.PW_MEMBER_TOKEN }}
      run: npm run test:e2e:role-matrix

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AZURE_WEBAPP_NAME != ''
    concurrency:
      group: azure-prod-deploy-${{ github.ref_name }}
      cancel-in-progress: true

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json

    - name: Install backend dependencies
      run: cd backend && npm ci

    - name: Build backend
      run: cd backend && npm run build

    - name: Prepare deployment package
      run: |
        rm -rf deploy-package
        rm -f release.zip
        mkdir -p deploy-package
        cp -R backend/dist deploy-package/dist
        cp -R backend/node_modules deploy-package/node_modules
        cp backend/package.json deploy-package/package.json
        cp backend/package-lock.json deploy-package/package-lock.json
        cp backend/server.js deploy-package/server.js
        cp backend/web.config deploy-package/web.config
        cd deploy-package
        zip -r ../release.zip .

    - name: Deploy to Azure (attempt 1)
      id: deploy_attempt_1
      continue-on-error: true
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ vars.AZURE_WEBAPP_NAME }}
        slot-name: 'production'
        publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
        package: release.zip

    - name: Backoff before retry
      if: ${{ steps.deploy_attempt_1.outcome == 'failure' }}
      run: sleep 30

    - name: Deploy to Azure (attempt 2)
      id: deploy_attempt_2
      if: ${{ steps.deploy_attempt_1.outcome == 'failure' }}
      continue-on-error: true
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ vars.AZURE_WEBAPP_NAME }}
        slot-name: 'production'
        publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
        package: release.zip

    - name: Backoff before final retry
      if: ${{ steps.deploy_attempt_1.outcome == 'failure' && steps.deploy_attempt_2.outcome == 'failure' }}
      run: sleep 60

    - name: Deploy to Azure (attempt 3)
      id: deploy_attempt_3
      if: ${{ steps.deploy_attempt_1.outcome == 'failure' && steps.deploy_attempt_2.outcome == 'failure' }}
      continue-on-error: true
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ vars.AZURE_WEBAPP_NAME }}
        slot-name: 'production'
        publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
        package: release.zip

    - name: Fail deploy after retries exhausted
      if: ${{ steps.deploy_attempt_1.outcome == 'failure' && steps.deploy_attempt_2.outcome == 'failure' && steps.deploy_attempt_3.outcome == 'failure' }}
      run: |
        echo "Azure deployment failed after 3 attempts."
        exit 1

    - name: Run post-deploy compliance smokes
      run: |
        BACKEND_BASE_URL="${{ vars.BACKEND_BASE_URL }}"
        if [ -z "$BACKEND_BASE_URL" ]; then
          BACKEND_BASE_URL="https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net"
        fi
        echo "Running compliance smokes against $BACKEND_BASE_URL"
        export BACKEND_BASE_URL
        npm --prefix backend run smoke:all

    - name: Alert on compliance smoke failure
      if: ${{ failure() }}
      run: |
        WEBHOOK_URL="${{ secrets.COMPLIANCE_ALERT_WEBHOOK_URL }}"
        if [ -z "$WEBHOOK_URL" ]; then
          echo "COMPLIANCE_ALERT_WEBHOOK_URL is not configured; skipping webhook alert."
          exit 0
        fi

        RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        ALERT_PAYLOAD=$(cat <<EOF
        {
          "text": "[phw-alpine-events] Post-deploy compliance smoke failure on main. Run: ${RUN_URL} | SHA: ${{ github.sha }}"
        }
        EOF
        )

        curl -fsS -X POST \
          -H "Content-Type: application/json" \
          -d "$ALERT_PAYLOAD" \
          "$WEBHOOK_URL"

  deploy_frontend:
    runs-on: ubuntu-latest
    needs: build
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.AZURE_FRONTEND_RESOURCE_GROUP != '' &&
      vars.AZURE_FRONTEND_WEBAPP_NAME != '' &&
      vars.VITE_EXTERNAL_CLIENT_ID != '' &&
      vars.VITE_EXTERNAL_TENANT_ID != '' &&
      vars.VITE_EXTERNAL_TENANT_NAME != '' &&
      vars.VITE_API_SCOPE != '' &&
      vars.VITE_API_BASE_URL != ''
    concurrency:
      group: azure-frontend-deploy-${{ github.ref_name }}
      cancel-in-progress: true

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      run: cd frontend && npm ci

    - name: Build frontend
      env:
        VITE_EXTERNAL_CLIENT_ID: ${{ vars.VITE_EXTERNAL_CLIENT_ID }}
        VITE_EXTERNAL_TENANT_ID: ${{ vars.VITE_EXTERNAL_TENANT_ID }}
        VITE_EXTERNAL_TENANT_NAME: ${{ vars.VITE_EXTERNAL_TENANT_NAME }}
        VITE_API_SCOPE: ${{ vars.VITE_API_SCOPE }}
        VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      run: cd frontend && npm run build

    - name: Package frontend artifact
      run: cd frontend/dist && zip -r ../../frontend-release.zip .

    - name: Azure login (frontend deploy)
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_FRONTEND_DEPLOY_CREDENTIALS }}

    - name: Deploy frontend to Azure
      run: |
        az webapp deploy \
          --resource-group "${{ vars.AZURE_FRONTEND_RESOURCE_GROUP }}" \
          --name "${{ vars.AZURE_FRONTEND_WEBAPP_NAME }}" \
          --src-path frontend-release.zip \
          --type zip