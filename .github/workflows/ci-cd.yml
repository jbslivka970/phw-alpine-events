name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  release:
    types: [ published ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: |
          frontend/package-lock.json
          backend/package-lock.json

    - name: Install frontend dependencies
      run: cd frontend && npm ci

    - name: Lint frontend
      run: cd frontend && npm run lint

    - name: Build frontend
      run: cd frontend && npm run build

    - name: Test frontend regression flows
      run: cd frontend && npm run test:flows

    - name: Install backend dependencies
      run: cd backend && npm ci

    - name: Typecheck backend
      run: cd backend && npm run typecheck

    - name: Validate backend test suites are non-empty
      run: node scripts/ci/check-empty-tests.mjs backend/src/__tests__

    - name: Build backend
      run: cd backend && npm run build

    - name: Test backend
      run: cd backend && npm run test:ci

    - name: Install Playwright role-matrix dependencies
      if: ${{ ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'workflow_dispatch' || github.event_name == 'release') && vars.E2E_API_BASE_URL != '' && vars.E2E_APP_URL != '' }}
      run: npm ci

    - name: Install Playwright Chromium
      if: ${{ ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'workflow_dispatch' || github.event_name == 'release') && vars.E2E_API_BASE_URL != '' && vars.E2E_APP_URL != '' }}
      run: npx playwright install --with-deps chromium

    - name: Refresh Playwright tokens and storage state
      if: ${{ ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'workflow_dispatch' || github.event_name == 'release') && vars.E2E_API_BASE_URL != '' && vars.E2E_APP_URL != '' }}
      env:
        E2E_API_BASE_URL: ${{ vars.E2E_API_BASE_URL }}
        E2E_APP_URL: ${{ vars.E2E_APP_URL }}
        PW_REFRESH_ROLE_TIMEOUT_MS: '240000'
        PW_ADMIN_USER: ${{ secrets.PW_ADMIN_USER }}
        PW_ADMIN_PASS: ${{ secrets.PW_ADMIN_PASS }}
        PW_EVENT_CREATOR_USER: ${{ secrets.PW_EVENT_CREATOR_USER }}
        PW_EVENT_CREATOR_PASS: ${{ secrets.PW_EVENT_CREATOR_PASS }}
        PW_MEMBER_USER: ${{ secrets.PW_MEMBER_USER }}
        PW_MEMBER_PASS: ${{ secrets.PW_MEMBER_PASS }}
      run: npm run e2e:refresh-tokens -- --soft-skip

    - name: Run Playwright role matrix and browser flows
      if: ${{ ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'workflow_dispatch' || github.event_name == 'release') && vars.E2E_API_BASE_URL != '' && vars.E2E_APP_URL != '' }}
      env:
        E2E_API_BASE_URL: ${{ vars.E2E_API_BASE_URL }}
        E2E_APP_URL: ${{ vars.E2E_APP_URL }}
        PW_ADMIN_USER: ${{ secrets.PW_ADMIN_USER }}
        PW_ADMIN_PASS: ${{ secrets.PW_ADMIN_PASS }}
        PW_EVENT_CREATOR_USER: ${{ secrets.PW_EVENT_CREATOR_USER }}
        PW_EVENT_CREATOR_PASS: ${{ secrets.PW_EVENT_CREATOR_PASS }}
        PW_MEMBER_USER: ${{ secrets.PW_MEMBER_USER }}
        PW_MEMBER_PASS: ${{ secrets.PW_MEMBER_PASS }}
      run: npm run test:e2e

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AZURE_WEBAPP_NAME != ''
    concurrency:
      group: azure-prod-deploy-${{ github.ref_name }}
      cancel-in-progress: false

    steps:
    - uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json

    - name: Install backend dependencies
      run: cd backend && npm ci

    - name: Build backend
      run: cd backend && npm run build

    - name: Prune backend dev dependencies
      run: cd backend && npm prune --omit=dev

    - name: Prepare deployment package
      run: |
        rm -rf deploy-package
        rm -f release.zip
        mkdir -p deploy-package
        cp -R backend/dist deploy-package/dist
        cp -R backend/node_modules deploy-package/node_modules
        cp backend/package.json deploy-package/package.json
        cp backend/package-lock.json deploy-package/package-lock.json
        cp backend/server.js deploy-package/server.js
        cp backend/web.config deploy-package/web.config
        cd deploy-package
        zip -r ../release.zip .

    - name: Deploy to Azure via Kudu zipdeploy
      env:
        AZURE_WEBAPP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
        AZUREAPPSERVICE_PUBLISHPROFILE: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
      run: |
        if [ -z "$AZUREAPPSERVICE_PUBLISHPROFILE" ]; then
          echo "AZUREAPPSERVICE_PUBLISHPROFILE is required"
          exit 1
        fi

        mapfile -t PROFILE_PARTS < <(python - <<'PY'
        import os
        import sys
        import xml.etree.ElementTree as ET

        raw = os.environ.get('AZUREAPPSERVICE_PUBLISHPROFILE', '').strip()
        if not raw:
          raise SystemExit('Missing AZUREAPPSERVICE_PUBLISHPROFILE')

        root = ET.fromstring(raw)
        profiles = root.findall('.//publishProfile')
        if not profiles:
          raise SystemExit('No publishProfile entries found')

        chosen = None
        for profile in profiles:
          if (profile.attrib.get('publishMethod') or '').lower() == 'msdeploy':
            chosen = profile
            break
        if chosen is None:
          chosen = profiles[0]

        publish_url = (chosen.attrib.get('publishUrl') or '').split(',')[0].strip()
        if publish_url.startswith('http://') or publish_url.startswith('https://'):
          scm_url = publish_url
        else:
          scm_url = f'https://{publish_url}'

        if ':' in scm_url.split('//', 1)[-1]:
          host = scm_url.split('//', 1)[-1].split(':', 1)[0]
          scm_url = f'https://{host}'

        username = chosen.attrib.get('userName', '').strip()
        password = chosen.attrib.get('userPWD', '').strip()
        if not username or not password or not scm_url:
          raise SystemExit('Publish profile is missing required credentials or URL')

        print(scm_url)
        print(username)
        print(password)
        PY
        )

        SCM_URL="${PROFILE_PARTS[0]}"
        KUDU_USER="${PROFILE_PARTS[1]}"
        KUDU_PASS="${PROFILE_PARTS[2]}"

        if [ -z "$SCM_URL" ] || [ -z "$KUDU_USER" ] || [ -z "$KUDU_PASS" ]; then
          echo "Failed to parse publish profile credentials"
          exit 1
        fi

        echo "Deploying release.zip to $AZURE_WEBAPP_NAME via $SCM_URL"

        # If a deployment is already in progress, wait briefly instead of colliding with 409.
        for attempt in $(seq 1 20); do
            DEPLOY_STATUS=$(curl -fsS -u "$KUDU_USER:$KUDU_PASS" "$SCM_URL/api/deployments/latest" 2>/dev/null | python - <<'PY'
            import json
            import sys

            try:
              data = json.load(sys.stdin)
            except Exception:
              print('unknown')
              raise SystemExit(0)

            status = data.get('status')
            if status is None:
              print('none')
            else:
              print(str(status))
            PY
            )

          if [ "$DEPLOY_STATUS" = "0" ] || [ "$DEPLOY_STATUS" = "1" ]; then
            echo "Existing deployment in progress (status=$DEPLOY_STATUS), waiting... ($attempt/20)"
            sleep 10
            continue
          fi
          break
        done

        RESPONSE_HEADERS=$(mktemp)
        curl -fsS -u "$KUDU_USER:$KUDU_PASS" \
          -X POST "$SCM_URL/api/zipdeploy?isAsync=true" \
          --data-binary @release.zip \
          -D "$RESPONSE_HEADERS" \
          -o /dev/null

        STATUS_URL=$(awk 'BEGIN{IGNORECASE=1} /^Location:/ {gsub("\r","",$2); print $2}' "$RESPONSE_HEADERS" | tail -n 1)
        rm -f "$RESPONSE_HEADERS"

        if [ -z "$STATUS_URL" ]; then
          STATUS_URL="$SCM_URL/api/deployments/latest"
        fi

        echo "Polling deployment status from: $STATUS_URL"

        for poll in $(seq 1 90); do
          STATUS_AND_MESSAGE=$(curl -fsS -u "$KUDU_USER:$KUDU_PASS" "$STATUS_URL" | python - <<'PY'
          import json
          import sys

          data = json.load(sys.stdin)
          status = data.get('status')
          msg = (data.get('status_text') or data.get('message') or '').replace('\n', ' ').strip()
          print(f"{status if status is not None else 'none'}\t{msg}")
          PY
          )

          DEPLOY_STATE=$(printf "%s" "$STATUS_AND_MESSAGE" | cut -f1)
          DEPLOY_MSG=$(printf "%s" "$STATUS_AND_MESSAGE" | cut -f2-)
          echo "Deploy state=$DEPLOY_STATE message=$DEPLOY_MSG"

          if [ "$DEPLOY_STATE" = "4" ]; then
            echo "Deployment succeeded"
            exit 0
          fi

          if [ "$DEPLOY_STATE" = "3" ]; then
            echo "Deployment failed"
            exit 1
          fi

          sleep 10
        done

        echo "Deployment status polling timed out"
        exit 1

  deploy_frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.AZURE_FRONTEND_RESOURCE_GROUP != '' &&
      vars.AZURE_FRONTEND_WEBAPP_NAME != '' &&
      vars.VITE_EXTERNAL_CLIENT_ID != '' &&
      vars.VITE_EXTERNAL_TENANT_ID != '' &&
      vars.VITE_EXTERNAL_TENANT_NAME != '' &&
      vars.VITE_API_SCOPE != '' &&
      vars.VITE_API_BASE_URL != ''
    concurrency:
      group: azure-frontend-deploy-${{ github.ref_name }}
      cancel-in-progress: true

    steps:
    - uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      run: cd frontend && npm ci

    - name: Build frontend
      env:
        VITE_EXTERNAL_CLIENT_ID: ${{ vars.VITE_EXTERNAL_CLIENT_ID }}
        VITE_EXTERNAL_TENANT_ID: ${{ vars.VITE_EXTERNAL_TENANT_ID }}
        VITE_EXTERNAL_TENANT_NAME: ${{ vars.VITE_EXTERNAL_TENANT_NAME }}
        VITE_API_SCOPE: ${{ vars.VITE_API_SCOPE }}
        VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      run: cd frontend && npm run build

    - name: Package frontend artifact
      run: cd frontend/dist && zip -r ../../frontend-release.zip .

    - name: Azure CLI login (frontend deploy)
      env:
        AZURE_FRONTEND_DEPLOY_CREDENTIALS: ${{ secrets.AZURE_FRONTEND_DEPLOY_CREDENTIALS }}
      run: |
        if [ -z "$AZURE_FRONTEND_DEPLOY_CREDENTIALS" ]; then
          echo "AZURE_FRONTEND_DEPLOY_CREDENTIALS is required"
          exit 1
        fi

        mapfile -t AZ_PARTS < <(python - <<'PY'
        import json
        import os

        creds = json.loads(os.environ['AZURE_FRONTEND_DEPLOY_CREDENTIALS'])
        print(creds.get('clientId', ''))
        print(creds.get('clientSecret', ''))
        print(creds.get('tenantId', ''))
        print(creds.get('subscriptionId', ''))
        PY
        )

        AZ_CLIENT_ID="${AZ_PARTS[0]}"
        AZ_CLIENT_SECRET="${AZ_PARTS[1]}"
        AZ_TENANT_ID="${AZ_PARTS[2]}"
        AZ_SUBSCRIPTION_ID="${AZ_PARTS[3]}"

        if [ -z "$AZ_CLIENT_ID" ] || [ -z "$AZ_CLIENT_SECRET" ] || [ -z "$AZ_TENANT_ID" ] || [ -z "$AZ_SUBSCRIPTION_ID" ]; then
          echo "AZURE_FRONTEND_DEPLOY_CREDENTIALS is missing required fields"
          exit 1
        fi

        az login --service-principal \
          --username "$AZ_CLIENT_ID" \
          --password "$AZ_CLIENT_SECRET" \
          --tenant "$AZ_TENANT_ID" \
          --output none

        az account set --subscription "$AZ_SUBSCRIPTION_ID"

    - name: Deploy frontend to Azure
      run: |
        az webapp deploy \
          --resource-group "${{ vars.AZURE_FRONTEND_RESOURCE_GROUP }}" \
          --name "${{ vars.AZURE_FRONTEND_WEBAPP_NAME }}" \
          --src-path frontend-release.zip \
          --type zip

  deploy_backend_smoke:
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AZURE_WEBAPP_NAME != ''

    steps:
    - uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json

    - name: Install backend dependencies
      run: cd backend && npm ci

    - name: Run post-deploy core compliance smokes
      run: |
        BACKEND_BASE_URL="${{ vars.BACKEND_BASE_URL }}"
        if [ -z "$BACKEND_BASE_URL" ]; then
          BACKEND_BASE_URL="https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net"
        fi
        echo "Running core compliance smokes against $BACKEND_BASE_URL"
        export BACKEND_BASE_URL
        npm --prefix backend run smoke:email
        npm --prefix backend run smoke:rsvp

    - name: Run post-deploy SMS compliance smoke (optional)
      id: sms_smoke
      if: ${{ vars.SMS_SMOKE_ENABLED == '1' || vars.SMS_COMPLIANCE_REQUIRED == '1' }}
      continue-on-error: ${{ vars.SMS_COMPLIANCE_REQUIRED != '1' }}
      run: |
        BACKEND_BASE_URL="${{ vars.BACKEND_BASE_URL }}"
        if [ -z "$BACKEND_BASE_URL" ]; then
          BACKEND_BASE_URL="https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net"
        fi
        echo "Running SMS compliance smoke against $BACKEND_BASE_URL"
        export BACKEND_BASE_URL
        npm --prefix backend run smoke:sms

    - name: Warn when optional SMS smoke fails
      if: ${{ steps.sms_smoke.outcome == 'failure' && vars.SMS_COMPLIANCE_REQUIRED != '1' }}
      run: |
        echo "::warning::SMS compliance smoke failed but is configured as non-blocking."
        echo "::warning::Set SMS_COMPLIANCE_REQUIRED=1 to enforce SMS smoke as a required production gate."

    - name: Alert on compliance smoke failure
      if: ${{ failure() }}
      run: |
        WEBHOOK_URL="${{ secrets.COMPLIANCE_ALERT_WEBHOOK_URL }}"
        if [ -z "$WEBHOOK_URL" ]; then
          echo "COMPLIANCE_ALERT_WEBHOOK_URL is not configured; skipping webhook alert."
          exit 0
        fi

        RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        ALERT_PAYLOAD=$(cat <<EOF
        {
          "text": "[phw-alpine-events] Post-deploy compliance smoke failure on main. Run: ${RUN_URL} | SHA: ${{ github.sha }}"
        }
        EOF
        )

        curl -fsS -X POST \
          -H "Content-Type: application/json" \
          -d "$ALERT_PAYLOAD" \
          "$WEBHOOK_URL"

  deploy_frontend_smoke:
    runs-on: ubuntu-latest
    needs:
    - deploy
    - deploy_frontend
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.E2E_APP_URL != ''

    steps:
    - uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: package-lock.json

    - name: Install Playwright smoke dependencies
      run: npm ci

    - name: Install Playwright Chromium
      run: npx playwright install --with-deps chromium

    - name: Determine browser smoke readiness
      id: smoke_ready
      env:
        PW_MEMBER_USER: ${{ secrets.PW_MEMBER_USER }}
        PW_MEMBER_PASS: ${{ secrets.PW_MEMBER_PASS }}
      run: |
        if [ -n "$PW_MEMBER_USER" ] && [ -n "$PW_MEMBER_PASS" ]; then
          echo "ready=1" >> "$GITHUB_OUTPUT"
        else
          echo "ready=0" >> "$GITHUB_OUTPUT"
          echo "::warning::Skipping browser smoke because PW_MEMBER_USER/PW_MEMBER_PASS are not configured."
        fi

    - name: Refresh member auth state for browser smoke
      if: ${{ steps.smoke_ready.outputs.ready == '1' }}
      env:
        E2E_APP_URL: ${{ vars.E2E_APP_URL }}
        PW_REFRESH_ROLE_TIMEOUT_MS: '240000'
        PW_MEMBER_USER: ${{ secrets.PW_MEMBER_USER }}
        PW_MEMBER_PASS: ${{ secrets.PW_MEMBER_PASS }}
      run: npm run e2e:refresh-tokens

    - name: Run post-deploy frontend browser smoke
      if: ${{ steps.smoke_ready.outputs.ready == '1' }}
      env:
        E2E_APP_URL: ${{ vars.E2E_APP_URL }}
      run: npx playwright test tests/e2e/browser-postdeploy-smoke.spec.ts

  release_smoke:
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'

    steps:
    - uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json

    - name: Install backend dependencies
      run: cd backend && npm ci

    - name: Run release compliance smokes
      run: |
        BACKEND_BASE_URL="${{ vars.BACKEND_BASE_URL }}"
        if [ -z "$BACKEND_BASE_URL" ]; then
          BACKEND_BASE_URL="https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net"
        fi
        echo "Running release core compliance smokes against $BACKEND_BASE_URL"
        export BACKEND_BASE_URL
        npm --prefix backend run smoke:email
        npm --prefix backend run smoke:rsvp

    - name: Run release SMS compliance smoke (optional)
      if: ${{ vars.SMS_SMOKE_ENABLED == '1' || vars.SMS_COMPLIANCE_REQUIRED == '1' }}
      continue-on-error: ${{ vars.SMS_COMPLIANCE_REQUIRED != '1' }}
      run: |
        BACKEND_BASE_URL="${{ vars.BACKEND_BASE_URL }}"
        if [ -z "$BACKEND_BASE_URL" ]; then
          BACKEND_BASE_URL="https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net"
        fi
        echo "Running release SMS compliance smoke against $BACKEND_BASE_URL"
        export BACKEND_BASE_URL
        npm --prefix backend run smoke:sms