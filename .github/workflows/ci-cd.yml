name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: |
          frontend/package-lock.json
          backend/package-lock.json

    - name: Install frontend dependencies
      run: cd frontend && npm ci

    - name: Build frontend
      run: cd frontend && npm run build

    - name: Install backend dependencies
      run: cd backend && npm ci

    - name: Build backend
      run: cd backend && npm run build

    - name: Test backend
      run: cd backend && npm test -- --runInBand

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AZURE_WEBAPP_NAME != ''
    concurrency:
      group: azure-prod-deploy-${{ github.ref_name }}
      cancel-in-progress: true

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json

    - name: Install backend dependencies
      run: cd backend && npm ci

    - name: Build backend
      run: cd backend && npm run build

    - name: Prepare deployment package
      run: |
        rm -rf deploy-package
        rm -f release.zip
        mkdir -p deploy-package
        cp -R backend/dist deploy-package/dist
        cp -R backend/node_modules deploy-package/node_modules
        cp backend/package.json deploy-package/package.json
        cp backend/package-lock.json deploy-package/package-lock.json
        cp backend/server.js deploy-package/server.js
        cp backend/web.config deploy-package/web.config
        cd deploy-package
        zip -r ../release.zip .

    - name: Deploy to Azure
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ vars.AZURE_WEBAPP_NAME }}
        slot-name: 'production'
        publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
        package: release.zip

    - name: Run post-deploy compliance smokes
      run: |
        BACKEND_BASE_URL="${{ vars.BACKEND_BASE_URL }}"
        if [ -z "$BACKEND_BASE_URL" ]; then
          BACKEND_BASE_URL="https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net"
        fi
        echo "Running compliance smokes against $BACKEND_BASE_URL"
        export BACKEND_BASE_URL
        npm --prefix backend run smoke:all

    - name: Alert on compliance smoke failure
      if: ${{ failure() }}
      run: |
        WEBHOOK_URL="${{ secrets.COMPLIANCE_ALERT_WEBHOOK_URL }}"
        if [ -z "$WEBHOOK_URL" ]; then
          echo "COMPLIANCE_ALERT_WEBHOOK_URL is not configured; skipping webhook alert."
          exit 0
        fi

        RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        ALERT_PAYLOAD=$(cat <<EOF
        {
          "text": "[phw-alpine-events] Post-deploy compliance smoke failure on main. Run: ${RUN_URL} | SHA: ${{ github.sha }}"
        }
        EOF
        )

        curl -fsS -X POST \
          -H "Content-Type: application/json" \
          -d "$ALERT_PAYLOAD" \
          "$WEBHOOK_URL"

  deploy_frontend:
    runs-on: ubuntu-latest
    needs: build
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.AZURE_FRONTEND_WEBAPP_NAME != '' &&
      vars.VITE_EXTERNAL_CLIENT_ID != '' &&
      vars.VITE_EXTERNAL_TENANT_ID != '' &&
      vars.VITE_EXTERNAL_TENANT_NAME != '' &&
      vars.VITE_API_SCOPE != '' &&
      vars.VITE_API_BASE_URL != ''
    concurrency:
      group: azure-frontend-deploy-${{ github.ref_name }}
      cancel-in-progress: true

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      run: cd frontend && npm ci

    - name: Build frontend
      env:
        VITE_EXTERNAL_CLIENT_ID: ${{ vars.VITE_EXTERNAL_CLIENT_ID }}
        VITE_EXTERNAL_TENANT_ID: ${{ vars.VITE_EXTERNAL_TENANT_ID }}
        VITE_EXTERNAL_TENANT_NAME: ${{ vars.VITE_EXTERNAL_TENANT_NAME }}
        VITE_API_SCOPE: ${{ vars.VITE_API_SCOPE }}
        VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      run: cd frontend && npm run build

    - name: Package frontend artifact
      run: cd frontend/dist && zip -r ../../frontend-release.zip .

    - name: Deploy frontend to Azure
      env:
        AZURE_FRONTEND_WEBAPP_NAME: ${{ vars.AZURE_FRONTEND_WEBAPP_NAME }}
        FRONTEND_PUBLISH_USERNAME: ${{ secrets.AZURE_FRONTEND_PUBLISH_USERNAME }}
        FRONTEND_PUBLISH_PASSWORD: ${{ secrets.AZURE_FRONTEND_PUBLISH_PASSWORD }}
      run: |
        python3 - <<'PY'
        import base64
        import json
        import os
        import time
        import urllib.error
        import urllib.request

        app_name = os.environ['AZURE_FRONTEND_WEBAPP_NAME']
        username = os.environ['FRONTEND_PUBLISH_USERNAME']
        password = os.environ['FRONTEND_PUBLISH_PASSWORD']
        if not username or not password:
          raise SystemExit('Missing frontend publish credentials secrets')

        kudu_base = f'https://{app_name}.scm.azurewebsites.net'
        deploy_url = f'{kudu_base}/api/zipdeploy?isAsync=true'

        with open('frontend-release.zip', 'rb') as zip_file:
          zip_payload = zip_file.read()

        auth = base64.b64encode(f'{username}:{password}'.encode('utf-8')).decode('ascii')
        headers = {
          'Authorization': f'Basic {auth}',
          'Content-Type': 'application/zip',
        }

        request = urllib.request.Request(deploy_url, data=zip_payload, headers=headers, method='POST')
        try:
          with urllib.request.urlopen(request, timeout=180) as response:
            _ = response.read()
            print(f'Zipdeploy accepted with status {response.status}')
        except urllib.error.HTTPError as error:
          body = error.read().decode('utf-8', errors='replace')
          raise SystemExit(f'Zipdeploy request failed: HTTP {error.code} {body}')

        status_url = f'{kudu_base}/api/deployments/latest'
        for attempt in range(60):
          status_request = urllib.request.Request(status_url, headers=headers, method='GET')
          with urllib.request.urlopen(status_request, timeout=60) as response:
            payload = json.loads(response.read().decode('utf-8'))

          status = payload.get('status')
          progress = payload.get('progress') or ''
          print(f'Deploy poll {attempt + 1}: status={status} progress={progress}')

          # Kudu deployment status 4 = success, 3 = failed
          if status == 4:
            print('Frontend deployment succeeded')
            break
          if status == 3:
            log_url = payload.get('log_url')
            raise SystemExit(f'Frontend deployment failed. log_url={log_url}')

          time.sleep(5)
        else:
          raise SystemExit('Timed out waiting for frontend deployment completion')
        PY