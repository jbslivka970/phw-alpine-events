name: Deploy Splash To Azure Web App

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'splash/**'
      - '.github/workflows/splash-deploy-azure-webapp.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.AZURE_SPLASH_WEBAPP_NAME != '' }}
    permissions:
      contents: read
    concurrency:
      group: splash-azure-webapp-${{ github.ref_name }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v5

      - name: Package splash site
        run: |
          rm -f splash-release.zip
          cd splash
          zip -r ../splash-release.zip .

      - name: Validate splash publish profile matches app name
        env:
          AZURE_SPLASH_WEBAPP_NAME: ${{ vars.AZURE_SPLASH_WEBAPP_NAME }}
          AZURE_SPLASH_PUBLISH_PROFILE: ${{ secrets.AZURE_SPLASH_PUBLISH_PROFILE }}
        run: |
          if [ -z "$AZURE_SPLASH_PUBLISH_PROFILE" ]; then
            echo "AZURE_SPLASH_PUBLISH_PROFILE is required"
            exit 1
          fi

          if [ -z "$AZURE_SPLASH_WEBAPP_NAME" ]; then
            echo "AZURE_SPLASH_WEBAPP_NAME is required"
            exit 1
          fi

            python - <<'PY'
            import os
            import sys
            import xml.etree.ElementTree as ET

            raw = (os.environ.get("AZURE_SPLASH_PUBLISH_PROFILE") or "").strip()
            app = (os.environ.get("AZURE_SPLASH_WEBAPP_NAME") or "").strip().lower()

            try:
              root = ET.fromstring(raw)
            except ET.ParseError as exc:
              print(f"Invalid AZURE_SPLASH_PUBLISH_PROFILE XML: {exc}")
              sys.exit(1)

            profiles = root.findall(".//publishProfile")
            if not profiles:
              print("AZURE_SPLASH_PUBLISH_PROFILE has no <publishProfile> entries")
              sys.exit(1)

            matches = []
            for p in profiles:
              site = (p.attrib.get("msdeploySite") or "").strip().lower()
              url = (p.attrib.get("publishUrl") or "").strip().lower()
              target = f"{site} {url}"
              if app in target:
                matches.append((site, url))

            if not matches:
              print("Publish profile does not appear to match AZURE_SPLASH_WEBAPP_NAME.")
              print(f"Expected app name fragment: {app}")
              print("Sample profile targets:")
              for p in profiles[:3]:
                site = (p.attrib.get("msdeploySite") or "").strip()
                url = (p.attrib.get("publishUrl") or "").strip()
                print(f"- msdeploySite='{site}' publishUrl='{url}'")
              sys.exit(1)

            print("Publish profile appears to match configured splash app name.")
            PY

      - name: Deploy splash to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_SPLASH_WEBAPP_NAME }}
          slot-name: 'production'
          publish-profile: ${{ secrets.AZURE_SPLASH_PUBLISH_PROFILE }}
          package: splash-release.zip
