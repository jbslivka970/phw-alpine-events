name: Deploy Splash To Azure Web App

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'splash/**'
      - '.github/workflows/splash-deploy-azure-webapp.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.AZURE_SPLASH_WEBAPP_NAME != '' }}
    permissions:
      contents: read
    concurrency:
      group: splash-azure-webapp-${{ github.ref_name }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v5

      - name: Package splash site
        run: |
          rm -f splash-release.zip
          cd splash
          zip -r ../splash-release.zip .

      - name: Validate splash publish profile matches app name
        env:
          AZURE_SPLASH_WEBAPP_NAME: ${{ vars.AZURE_SPLASH_WEBAPP_NAME }}
          AZURE_SPLASH_PUBLISH_PROFILE: ${{ secrets.AZURE_SPLASH_PUBLISH_PROFILE }}
        run: |
          if [ -z "$AZURE_SPLASH_PUBLISH_PROFILE" ]; then
            echo "AZURE_SPLASH_PUBLISH_PROFILE is required"
            exit 1
          fi

          if [ -z "$AZURE_SPLASH_WEBAPP_NAME" ]; then
            echo "AZURE_SPLASH_WEBAPP_NAME is required"
            exit 1
          fi

          APP_LC=$(printf "%s" "$AZURE_SPLASH_WEBAPP_NAME" | tr '[:upper:]' '[:lower:]')
          PROFILE_LC=$(printf "%s" "$AZURE_SPLASH_PUBLISH_PROFILE" | tr '[:upper:]' '[:lower:]')

          if ! printf "%s" "$PROFILE_LC" | grep -Fq "$APP_LC"; then
            echo "Publish profile does not appear to match AZURE_SPLASH_WEBAPP_NAME."
            echo "Expected app name fragment: $AZURE_SPLASH_WEBAPP_NAME"
            echo "The publish profile XML should contain the splash app name in msdeploySite/publishUrl."
            exit 1
          fi

          echo "Publish profile appears to match configured splash app name."

      - name: Deploy splash to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_SPLASH_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_SPLASH_PUBLISH_PROFILE }}
          package: splash-release.zip
