name: Deploy Splash To Azure Web App

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'splash/**'
      - '.github/workflows/splash-deploy-azure-webapp.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.AZURE_SPLASH_WEBAPP_NAME != '' }}
    permissions:
      contents: read
    concurrency:
      group: splash-azure-webapp-${{ github.ref_name }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v5

      - name: Package splash site
        run: |
          rm -f splash-release.zip
          cd splash
          zip -r ../splash-release.zip .

      - name: Azure CLI login (splash deploy)
        env:
          AZURE_SPLASH_DEPLOY_CREDENTIALS: ${{ secrets.AZURE_SPLASH_DEPLOY_CREDENTIALS }}
          AZURE_FRONTEND_DEPLOY_CREDENTIALS: ${{ secrets.AZURE_FRONTEND_DEPLOY_CREDENTIALS }}
        run: |
          DEPLOY_CREDS="$AZURE_SPLASH_DEPLOY_CREDENTIALS"
          if [ -z "$DEPLOY_CREDS" ]; then
            DEPLOY_CREDS="$AZURE_FRONTEND_DEPLOY_CREDENTIALS"
          fi

          if [ -z "$DEPLOY_CREDS" ]; then
            echo "Set AZURE_SPLASH_DEPLOY_CREDENTIALS (preferred) or AZURE_FRONTEND_DEPLOY_CREDENTIALS"
            exit 1
          fi

          export DEPLOY_CREDS

          AZ_LINE=$(python -c "import json,os; creds=json.loads(os.environ['DEPLOY_CREDS']); print('\\t'.join([creds.get('clientId',''), creds.get('clientSecret',''), creds.get('tenantId',''), creds.get('subscriptionId','')]))")

          IFS=$'\t' read -r AZ_CLIENT_ID AZ_CLIENT_SECRET AZ_TENANT_ID AZ_SUBSCRIPTION_ID <<< "$AZ_LINE"

          if [ -z "$AZ_CLIENT_ID" ] || [ -z "$AZ_CLIENT_SECRET" ] || [ -z "$AZ_TENANT_ID" ] || [ -z "$AZ_SUBSCRIPTION_ID" ]; then
            echo "AZURE_SPLASH_DEPLOY_CREDENTIALS is missing required fields"
            exit 1
          fi

          for attempt in $(seq 1 5); do
            set +e
            LOGIN_OUTPUT=$(timeout 120 az login --service-principal \
              --username "$AZ_CLIENT_ID" \
              --password "$AZ_CLIENT_SECRET" \
              --tenant "$AZ_TENANT_ID" \
              --output none 2>&1)
            LOGIN_EXIT=$?
            set -e

            echo "$LOGIN_OUTPUT"

            if [ "$LOGIN_EXIT" -eq 0 ]; then
              az account set --subscription "$AZ_SUBSCRIPTION_ID"
              echo "Azure splash login succeeded."
              exit 0
            fi

            if [ "$LOGIN_EXIT" -eq 124 ] || printf "%s" "$LOGIN_OUTPUT" | grep -Eqi "timed out|timeout|temporarily unavailable|connection|EOF|unreachable"; then
              echo "Azure splash login transient failure (attempt $attempt/5). Retrying in 15s..."
              sleep 15
              continue
            fi

            echo "Azure splash login failed with a non-retryable error."
            exit "$LOGIN_EXIT"
          done

          echo "Azure splash login failed after retries."
          exit 1

      - name: Deploy splash to Azure
        env:
          AZURE_SPLASH_RESOURCE_GROUP: ${{ vars.AZURE_SPLASH_RESOURCE_GROUP }}
          AZURE_FRONTEND_RESOURCE_GROUP: ${{ vars.AZURE_FRONTEND_RESOURCE_GROUP }}
        run: |
          TARGET_RG="$AZURE_SPLASH_RESOURCE_GROUP"
          if [ -z "$TARGET_RG" ]; then
            TARGET_RG="$AZURE_FRONTEND_RESOURCE_GROUP"
          fi

          if [ -z "$TARGET_RG" ]; then
            echo "Set AZURE_SPLASH_RESOURCE_GROUP (preferred) or AZURE_FRONTEND_RESOURCE_GROUP"
            exit 1
          fi

          for attempt in $(seq 1 18); do
            set +e
            DEPLOY_OUTPUT=$(az webapp deploy \
              --resource-group "$TARGET_RG" \
              --name "${{ vars.AZURE_SPLASH_WEBAPP_NAME }}" \
              --src-path splash-release.zip \
              --type zip \
              --async true \
              --track-status false \
              --timeout 1800000 2>&1)
            DEPLOY_EXIT=$?
            set -e

            echo "$DEPLOY_OUTPUT"

            if [ "$DEPLOY_EXIT" -eq 0 ]; then
              echo "Splash deployment accepted."
              exit 0
            fi

            if printf "%s" "$DEPLOY_OUTPUT" | grep -qi "Another deployment is in progress"; then
              echo "Splash deployment locked by another deployment (attempt $attempt/18). Retrying in 20s..."
              sleep 20
              continue
            fi

            echo "Splash deploy failed with a non-retryable error."
            exit "$DEPLOY_EXIT"
          done

          echo "Splash deploy did not obtain deployment lock after retries."
          exit 1
