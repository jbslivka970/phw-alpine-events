name: Deploy Splash To GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'splash/**'
      - '.github/workflows/splash-deploy-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: splash-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload splash artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: splash

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
